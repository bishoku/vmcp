server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://control-plane:8081;
    proxy_set_header Host $host;
  }

  location /auth/ {
    proxy_pass http://control-plane:8081;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
