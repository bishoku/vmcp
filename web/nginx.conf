server {
  listen 8080;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass ${VMCP_CONTROL_PLANE_URL};
    proxy_set_header Host $host;
  }

  location /auth/ {
    proxy_pass ${VMCP_CONTROL_PLANE_URL};
    proxy_set_header Host $host;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location = /runtime-config.js {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
