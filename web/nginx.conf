server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https: http:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;

  location /api/ {
    proxy_pass ${VMCP_CONTROL_PLANE_URL};
    proxy_set_header Host $host;
  }

  location /auth/ {
    proxy_pass ${VMCP_CONTROL_PLANE_URL};
    proxy_set_header Host $host;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location = /runtime-config.js {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https: http:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
