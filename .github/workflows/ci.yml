name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vmcp
          POSTGRES_PASSWORD: vmcp
          POSTGRES_DB: vmcp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vmcp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VMCP_TEST_REDIS_URL: redis://localhost:6379/0
      VMCP_TEST_DATABASE_URL: postgres://vmcp:vmcp@localhost:5432/vmcp_test?sslmode=disable
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm ci
          npm run lint
          npm run build
