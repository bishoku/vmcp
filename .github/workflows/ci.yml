name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vmcp
          POSTGRES_PASSWORD: vmcp
          POSTGRES_DB: vmcp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vmcp" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VMCP_REQUIRE_INTEGRATION: "1"
      VMCP_REQUIRE_SDK_INTEROP: "1"
      VMCP_TEST_REDIS_URL: redis://localhost:6379/0
      VMCP_TEST_DATABASE_URL: postgres://vmcp:vmcp@localhost:5432/vmcp_test?sslmode=disable
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix ../web
      - run: go vet ./...
      - run: go test -race -count=1 -json ./... > ../verification.jsonl
      - run: python3 ../scripts/check-test-results.py ../verification.jsonl
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm ci
          npm run lint
          npm run build
          npm test
          npm run validate:api
          npx playwright install --with-deps chromium
          npm run test:browser

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: |
          helm lint deploy/helm/vmcp --set controlPlane.image=vmcp/cp:test,dataPlane.image=vmcp/dp:test,migration.image=vmcp/migrate:test,controlPlane.secretName=cp,dataPlane.secretName=dp,migration.secretName=migration
          helm template test deploy/helm/vmcp --set controlPlane.image=vmcp/cp:test,dataPlane.image=vmcp/dp:test,migration.image=vmcp/migrate:test,controlPlane.secretName=cp,dataPlane.secretName=dp,migration.secretName=migration > /tmp/vmcp-rendered.yaml
      - run: docker build --build-arg SERVICE=data-plane -t vmcp-dp:ci core
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: vmcp-dp:ci
          severity: CRITICAL,HIGH
          exit-code: "1"

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - name: Verify real stdio sandbox
        run: |
          mkdir -p /tmp/vmcp-stdio-fixture
          cd core
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/vmcp-stdio-fixture/fixture-stdio ./cmd/fixture-stdio
          cd ..
          docker build -f deploy/Dockerfile.stdio-fixture -t vmcp-stdio-fixture:test /tmp/vmcp-stdio-fixture
          export VMCP_TEST_STDIO_IMAGE=$(docker image inspect vmcp-stdio-fixture:test --format '{{.Id}}')
          cd core
          go test -race -count=1 ./internal/stdioworker
