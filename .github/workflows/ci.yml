name: ci

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    services:
      wiremock:
        image: wiremock/wiremock:3.13.2
        ports: ["18089:8080"]
      redis:
        image: redis:7
        ports:
          - 6379:6379
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vmcp
          POSTGRES_PASSWORD: vmcp
          POSTGRES_DB: vmcp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vmcp -d vmcp_test" --health-interval 5s --health-timeout 5s --health-retries 10
      kafka:
        image: apache/kafka:4.0.0
        ports: ["19092:19092"]
        env:
          KAFKA_ADVERTISED_LISTENERS: "INTERNAL://localhost:9092,EXTERNAL://localhost:19092"
          KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
          KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
          KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093"
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
          KAFKA_NODE_ID: "1"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_PROCESS_ROLES: "broker,controller"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" --health-interval 5s --health-timeout 10s --health-retries 30
      rabbitmq:
        image: rabbitmq:4.1-alpine
        ports: ["5673:5672"]
        env:
          RABBITMQ_DEFAULT_PASS: "audit"
          RABBITMQ_DEFAULT_USER: "audit"
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 10s --health-retries 30
    env:
      VMCP_TEST_KAFKA_BROKERS: localhost:19092
      VMCP_TEST_RABBITMQ_URL: amqp://audit:audit@localhost:5673/
      VMCP_TEST_WIREMOCK_URL: http://127.0.0.1:18089
      VMCP_REQUIRE_INTEGRATION: "1"
      VMCP_REQUIRE_SDK_INTEROP: "1"
      VMCP_TEST_REDIS_URL: redis://localhost:6379/0
      VMCP_TEST_DATABASE_URL: postgres://vmcp:vmcp@localhost:5432/vmcp_test?sslmode=disable
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix ../web
      - name: Check broker dependency isolation
        run: python3 ../scripts/check-exporter-isolation.py
      - run: go vet ./...
      - name: Run Go race and integration tests
        run: go test -race -count=1 -json ./... | tee ../verification.jsonl
      - name: Check test results (including failures and skips)
        if: ${{ !cancelled() && hashFiles('verification.jsonl') != '' }}
        run: python3 ../scripts/check-test-results.py ../verification.jsonl
      - name: Upload Go test results
        if: ${{ !cancelled() && hashFiles('verification.jsonl') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: verification.jsonl
          retention-days: 7
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        timeout-minutes: 5
        run: npm ci
      - name: Audit web dependencies
        timeout-minutes: 3
        run: npm audit --audit-level=high
      - name: Lint web
        run: npm run lint
      - name: Build web
        run: npm run build
      - name: Run web unit tests
        timeout-minutes: 5
        run: npm test
      - name: Validate OpenAPI assets
        run: npm run validate:api
      - name: Install browser and system dependencies
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        timeout-minutes: 10
        run: npm run test:browser

  deployment-validation:
    name: Helm and image validation (disposable cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix web
      - name: Test Docker release manifest generation
        run: python3 -m unittest discover -s scripts -p 'test_prepare*release.py'
      - name: Test benchmark reporting and archive retention
        run: python3 -m unittest discover -s benchmark/kubernetes -p 'test_*.py'
      - name: Test trial installer
        run: |
          bash -n deploy/helm/vmcp/quickstart.sh
          python3 -m unittest discover -s tests/helm -p 'test_quickstart.py'
      - name: Validate chart configurations
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami --force-update
          helm dependency build deploy/helm/vmcp
          helm lint deploy/helm/vmcp -f deploy/helm/vmcp/examples/production.yaml
          node --test tests/helm/chart.test.cjs
          helm template test deploy/helm/vmcp -f deploy/helm/vmcp/examples/production.yaml > /tmp/vmcp-rendered.yaml
          helm template test deploy/helm/vmcp -f deploy/helm/vmcp/examples/production.yaml --is-upgrade > /tmp/vmcp-upgrade.yaml
          helm template test deploy/helm/vmcp -f deploy/helm/vmcp/examples/production.yaml -f deploy/helm/vmcp/examples/bundled.yaml > /tmp/vmcp-bundled.yaml
      - name: Build local validation images
        run: |
          for service in control-plane data-plane migrate fixture-mcp; do
            docker build --build-arg SERVICE="$service" -t "vmcp/$service:helm-test" core
          done
          docker tag vmcp/data-plane:helm-test vmcp-dp:ci
          docker build -t vmcp/web:helm-test web
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: vmcp-helm-test
          node_image: kindest/node:v1.32.2
          version: v0.27.0
      - name: Load local images into the disposable cluster
        run: |
          kind load docker-image --name vmcp-helm-test vmcp/control-plane:helm-test vmcp/data-plane:helm-test vmcp/migrate:helm-test vmcp/fixture-mcp:helm-test vmcp/web:helm-test
      - name: Validate Kubernetes schemas against the API server
        run: |
          for manifest in /tmp/vmcp-rendered.yaml /tmp/vmcp-upgrade.yaml /tmp/vmcp-bundled.yaml; do
            kubectl --context kind-vmcp-helm-test apply --dry-run=server -f "$manifest"
          done
      - name: Verify real Helm installation and upgrade
        run: python3 tests/helm/smoke.py

  image-security:
    name: Image security (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        service: [web, control-plane, data-plane, migrate, audit-exporter, audit-exporter-kafka, audit-exporter-rabbitmq, tenant-router, rotate-secrets]
    steps:
      - uses: actions/checkout@v7
      - name: Test image security gates
        run: python3 -m unittest discover -s scripts -p 'test_image_security.py'
      - name: Build native image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          context=core
          if [[ "$SERVICE" == web ]]; then context=web; fi
          docker build --pull --build-arg SERVICE="$SERVICE" -t "vmcp/$SERVICE:security" "$context"
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.76.1
      - name: Scan native image
        env:
          SERVICE: ${{ matrix.service }}
          TRIVY_IMAGE_SRC: docker
        run: scripts/scan-image.sh "vmcp/$SERVICE:security" image-security linux/amd64
      - name: Preserve scan reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: image-security-${{ matrix.service }}
          path: image-security/*.json
          if-no-files-found: warn
          retention-days: 30
