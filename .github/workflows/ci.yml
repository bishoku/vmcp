name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vmcp
          POSTGRES_PASSWORD: vmcp
          POSTGRES_DB: vmcp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vmcp -d vmcp_test" --health-interval 5s --health-timeout 5s --health-retries 10
      kafka:
        image: apache/kafka:4.0.0
        ports: ["19092:19092"]
        env:
          KAFKA_ADVERTISED_LISTENERS: "INTERNAL://localhost:9092,EXTERNAL://localhost:19092"
          KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
          KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
          KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
          KAFKA_LISTENERS: "INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093"
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
          KAFKA_NODE_ID: "1"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_PROCESS_ROLES: "broker,controller"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" --health-interval 5s --health-timeout 10s --health-retries 30
      rabbitmq:
        image: rabbitmq:4.1-alpine
        ports: ["5673:5672"]
        env:
          RABBITMQ_DEFAULT_PASS: "audit"
          RABBITMQ_DEFAULT_USER: "audit"
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 10s --health-retries 30
    env:
      VMCP_TEST_KAFKA_BROKERS: localhost:19092
      VMCP_TEST_RABBITMQ_URL: amqp://audit:audit@localhost:5673/
      VMCP_REQUIRE_INTEGRATION: "1"
      VMCP_REQUIRE_SDK_INTEROP: "1"
      VMCP_TEST_REDIS_URL: redis://localhost:6379/0
      VMCP_TEST_DATABASE_URL: postgres://vmcp:vmcp@localhost:5432/vmcp_test?sslmode=disable
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix ../web
      - name: Check broker dependency isolation
        run: python3 ../scripts/check-exporter-isolation.py
      - run: go vet ./...
      - name: Run Go race and integration tests
        run: go test -race -count=1 -json ./... | tee ../verification.jsonl
      - name: Check test results (including failures and skips)
        if: ${{ !cancelled() && hashFiles('verification.jsonl') != '' }}
        run: python3 ../scripts/check-test-results.py ../verification.jsonl
      - name: Upload Go test results
        if: ${{ !cancelled() && hashFiles('verification.jsonl') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: verification.jsonl
          retention-days: 7
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm ci
          npm run lint
          npm run build
          npm test
          npm run validate:api
          npx playwright install --with-deps chromium
          npm run test:browser

  deployment-validation:
    name: Deployment validation (no deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: |
          helm lint deploy/helm/vmcp --set controlPlane.image=vmcp/cp:test,dataPlane.image=vmcp/dp:test,migration.image=vmcp/migrate:test,controlPlane.secretName=cp,dataPlane.secretName=dp,migration.secretName=migration
          helm template test deploy/helm/vmcp --set controlPlane.image=vmcp/cp:test,dataPlane.image=vmcp/dp:test,migration.image=vmcp/migrate:test,controlPlane.secretName=cp,dataPlane.secretName=dp,migration.secretName=migration > /tmp/vmcp-rendered.yaml
      - run: docker build --build-arg SERVICE=data-plane -t vmcp-dp:ci core
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: vmcp-dp:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
