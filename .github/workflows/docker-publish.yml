name: publish-docker-hub

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: docker-hub-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_NAMESPACE: barishoku

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate version tag
        id: version
        shell: bash
        run: |
          version="$GITHUB_REF_NAME"
          if [[ ! "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || (( ${#version} > 128 )); then
            echo "Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease (maximum 128 characters)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  verify:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    permissions:
      contents: read
      id-token: write
    needs: [validate, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - service: web
            context: web
            buildArgs: ""
          - service: control-plane
            context: core
            buildArgs: SERVICE=control-plane
          - service: data-plane
            context: core
            buildArgs: SERVICE=data-plane
          - service: omni-mcp
            context: core
            buildArgs: SERVICE=omni-mcp
          - service: migrate
            context: core
            buildArgs: SERVICE=migrate
          - service: audit-exporter
            context: core
            buildArgs: SERVICE=audit-exporter
          - service: audit-exporter-kafka
            context: core
            buildArgs: SERVICE=audit-exporter-kafka
          - service: audit-exporter-rabbitmq
            context: core
            buildArgs: SERVICE=audit-exporter-rabbitmq
          - service: tenant-router
            context: core
            buildArgs: SERVICE=tenant-router
          - service: rotate-secrets
            context: core
            buildArgs: SERVICE=rotate-secrets
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up ARM emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_NAMESPACE }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build candidate images by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.buildArgs }}
          platforms: linux/amd64,linux/arm64
          # Candidates are addressable by digest; version tags are added only after verification.
          outputs: type=image,name=${{ env.DOCKERHUB_NAMESPACE }}/vmcp-${{ matrix.service }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=vmcp-${{ matrix.service }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=publish-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.service }}
          provenance: mode=max
          sbom: true
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
      - name: Scan exact release digest on both architectures
        env:
          IMAGE: ${{ env.DOCKERHUB_NAMESPACE }}/vmcp-${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TRIVY_IMAGE_SRC: remote
        run: scripts/scan-image.sh "$IMAGE@$DIGEST" image-security linux/amd64 linux/arm64
      - name: Preserve release scan reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: release-image-security-${{ matrix.service }}
          path: image-security/*.json
          if-no-files-found: warn
          retention-days: 90
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: Sign and verify the release digest
        env:
          IMAGE: ${{ env.DOCKERHUB_NAMESPACE }}/vmcp-${{ matrix.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/docker-publish.yml@${{ github.ref }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          scripts/verify-image-signature.sh "$IMAGE@$DIGEST" "$CERTIFICATE_IDENTITY"
      - name: Tag verified release digest
        env:
          IMAGE: ${{ env.DOCKERHUB_NAMESPACE }}/vmcp-${{ matrix.service }}
          VERSION: ${{ needs.validate.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
      - name: Record published manifest digest
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: ${{ env.DOCKERHUB_NAMESPACE }}/vmcp-${{ matrix.service }}
          VERSION: ${{ needs.validate.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          service, image, version, digest = (os.environ[k] for k in ['SERVICE', 'IMAGE', 'VERSION', 'DIGEST'])
          Path('image-digests').mkdir()
          Path(f'image-digests/{service}.json').write_text(json.dumps({'service': service, 'image': image, 'version': version, 'digest': digest}) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'Published `{image}:{version}`\n\nHelm reference: `{image}@{digest}`\n')
          PYTHON
      - uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.service }}
          path: image-digests/*.json
          if-no-files-found: error
          retention-days: 90

  helm-values:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: image-digest-*
          merge-multiple: true
          path: image-digests
      - name: Generate Helm image values and release manifest
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 scripts/prepare-image-release.py image-digests image-release --version "$VERSION"
          cat image-release/helm-images.yaml >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: docker-images-${{ needs.validate.outputs.version }}
          path: image-release/
          if-no-files-found: error
          retention-days: 90
