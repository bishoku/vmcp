global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 10s
rule_files:
  - /etc/prometheus/vmcp-alerts.yml
scrape_configs:
  - job_name: vmcp-control-plane
    metrics_path: /metrics
    static_configs:
      - targets: [control-plane:8081]
        labels: {plane: control}
  - job_name: vmcp-data-plane
    metrics_path: /metrics
    static_configs:
      - targets: [data-plane-1:8080, data-plane-2:8080]
        labels: {plane: data}
