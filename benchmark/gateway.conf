upstream vmcp_data_planes {
    server data-plane-1:8080;
    server data-plane-2:8080;
}
# Browser verification uses explicit bearer credentials, never cookies. Keep these
# exact origins aligned with VMCP_ALLOWED_ORIGINS in compose.yaml.
map $http_origin $vmcp_cors_origin {
    default "";
    "http://localhost:3300" "http://localhost:3300";
    "http://localhost:8800" "http://localhost:8800";
}
map "$request_method:$vmcp_cors_origin" $vmcp_deny_preflight {
    default 0;
    "OPTIONS:" 1;
}
server {
    listen 80;
    client_max_body_size 4m;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    # An interrupted unsafe POST must not be replayed on another node.
    proxy_next_upstream off;

    location /mcp/v1/virtual/ {
        add_header Access-Control-Allow-Origin $vmcp_cors_origin always;
        add_header Access-Control-Allow-Methods "POST, GET, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, MCP-Protocol-Version, MCP-Session-Id, Last-Event-ID" always;
        add_header Access-Control-Expose-Headers "MCP-Session-Id, MCP-Protocol-Version, WWW-Authenticate, Retry-After" always;
        add_header Vary "Origin" always;
        if ($vmcp_deny_preflight) { return 403; }
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass http://vmcp_data_planes;
    }
    location / {
        proxy_pass http://vmcp_data_planes;
    }
}
