services:
  postgres:
    image: postgres:18-alpine
    cpus: 2
    mem_limit: 2g
    environment:
      POSTGRES_USER: acceptance
      POSTGRES_PASSWORD: acceptance-only
      POSTGRES_DB: acceptance
    ports: ["127.0.0.1:${VMCP_ACCEPTANCE_PG_PORT:-55434}:5432"]
    command: [postgres, -c, max_connections=200]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U acceptance -d acceptance"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    cpus: 0.5
    mem_limit: 256m
    ports: ["127.0.0.1:${VMCP_ACCEPTANCE_REDIS_PORT:-56381}:6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 30
