{{- if and .Values.migration.enabled (eq .Values.migration.mode "auto") }}
{{- $cfg := .Values.migration }}
{{- $ctx := dict "root" . "component" "migration" "cfg" $cfg }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vmcp.name" $ctx }}-{{ .Release.Revision }}
  labels:
    {{- include "vmcp.labels" $ctx | nindent 4 }}
  {{- if .Release.IsUpgrade }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "10"
  {{- end }}
spec:
  backoffLimit: {{ $cfg.backoffLimit }}
  activeDeadlineSeconds: {{ $cfg.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ $cfg.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "vmcp.labels" $ctx | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "vmcp.serviceAccount" $ctx }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.workloadDefaults.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $cfg.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $cfg.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ required "migration.image is required" $cfg.image | quote }}
          securityContext:
            {{- toYaml .Values.workloadDefaults.securityContext | nindent 12 }}
          env:
            {{- include "vmcp.env" $ctx | nindent 12 }}
          resources: {{ toYaml $cfg.resources | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- with $cfg.extraVolumeMounts }}{{ toYaml . | nindent 12 }}{{ end }}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        {{- with $cfg.extraVolumes }}{{ toYaml . | nindent 8 }}{{ end }}
{{- end }}
