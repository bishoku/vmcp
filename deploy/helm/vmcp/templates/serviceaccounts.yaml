{{- $all := include "vmcp.components" . | fromJson }}
{{- if .Values.migration.enabled }}{{ $_ := set $all "migration" .Values.migration }}{{ end }}
{{- range $c, $cfg := $all }}
{{- if and $cfg.enabled $cfg.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vmcp.serviceAccount" (dict "root" $ "component" $c "cfg" $cfg) }}
  {{- with $cfg.serviceAccount.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}{{- end }}
