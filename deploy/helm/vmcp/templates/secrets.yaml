{{- range $id, $source := (include "vmcp.sources" . | fromJson) }}
{{- if and $source.value $source.existingSecret }}{{ fail (printf "%s: set value OR existingSecret, not both" $id) }}{{ end }}
{{- if not (or $source.value $source.existingSecret) }}{{ fail (printf "%s: value or existingSecret is required" $id) }}{{ end }}
{{- if not $source.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vmcp.secretName" (dict "root" $ "id" $id) }}
  labels:
    {{- include "vmcp.labels" (dict "root" $ "component" "configuration") | nindent 4 }}
type: Opaque
stringData:
  {{ default "value" $source.key }}: {{ tpl ($source.value | toString) $ | quote }}
{{- end }}
{{- end }}
{{- range .Values.extraSecrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ tpl .name $ | quote }}
type: Opaque
stringData:
  {{- range $key, $value := .data }}
  {{ $key }}: {{ tpl ($value | toString) $ | quote }}
  {{- end }}
{{- end }}
