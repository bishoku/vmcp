{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "vmcp.fullname" . }}
  {{- with .Values.ingress.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{ toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.web.enabled }}
    - host: {{ required "ingress.webHost is required" .Values.ingress.webHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ include "vmcp.name" (dict "root" . "component" "web") }}, port: {number: 8080}}
    {{- end }}
    {{- if .Values.dataPlane.enabled }}
    - host: {{ required "ingress.gatewayHost is required" .Values.ingress.gatewayHost | quote }}
      http:
        paths:
          {{- range $path := list "/mcp/" "/.well-known/oauth-protected-resource" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service: {name: {{ include "vmcp.name" (dict "root" $ "component" "data-plane") }}, port: {number: 8080}}
          {{- end }}
    {{- end }}
{{- end }}
