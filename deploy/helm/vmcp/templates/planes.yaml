{{- range $plane, $cfg := dict "control-plane" .Values.controlPlane "data-plane" .Values.dataPlane }}
{{- if lt (int $cfg.replicas) 2 }}{{ fail "production planes require at least two replicas" }}{{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $plane }}
spec:
  replicas: {{ $cfg.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $plane }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $plane }}}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 105
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $plane }}}
      containers:
        - name: {{ $plane }}
          image: {{ required "plane image digest is required" $cfg.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports:
            - {name: http, containerPort: {{ if eq $plane "data-plane" }}8080{{ else }}8081{{ end }}}
          envFrom:
            - secretRef: {name: {{ required "existing plane secretName is required" $cfg.secretName }}}
          env:
            - {name: VMCP_SKIP_MIGRATIONS, value: "true"}
            {{- range $name, $value := $cfg.env }}
            - {name: {{ $name }}, value: {{ $value | quote }}}
            {{- end }}
          startupProbe: {httpGet: {path: /healthz, port: http}, failureThreshold: 60, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, timeoutSeconds: 2}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 3, timeoutSeconds: 2, failureThreshold: 1}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $plane }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $plane }}}
  ports: [{name: http, port: {{ if eq $plane "data-plane" }}8080{{ else }}8081{{ end }}, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $.Release.Name }}-{{ $plane }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $plane }}}
{{- end }}
