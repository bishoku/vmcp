apiVersion: v2
name: vmcp
description: HTTP MCP gateway, management UI and independent audit exporters
type: application
version: 1.2.2
appVersion: v1.2.2
kubeVersion: ">=1.27.0-0"
dependencies:
  - name: postgresql
    version: 16.7.27
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 21.2.14
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: kafka
    version: 32.4.3
    repository: https://charts.bitnami.com/bitnami
    condition: kafka.enabled
  - name: rabbitmq
    version: 16.0.14
    repository: https://charts.bitnami.com/bitnami
    condition: rabbitmq.enabled
