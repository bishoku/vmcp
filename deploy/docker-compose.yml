name: vmcp

# DEV ONLY. The default master key below is public; set VMCP_MASTER_KEY
# (openssl rand -base64 32) for anything beyond local development.
x-master-key: &master-key
  VMCP_MASTER_KEY: ${VMCP_MASTER_KEY:-OsOj5XCz4oi+W3+L3o0am9uZGfYkNmsXHMu5uCDEP04=}

# Explicit operator grants for internal MCP upstreams/token endpoints. Empty is secure by default.
x-network-policy: &network-policy
  VMCP_EGRESS_ALLOW_CIDRS: ${VMCP_EGRESS_ALLOW_CIDRS:-}
  VMCP_EGRESS_ALLOW_HOSTS: ${VMCP_EGRESS_ALLOW_HOSTS:-}

# Match the Helm workload restrictions for application containers.
x-app-security: &app-security
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,uid=65532,gid=65532,mode=1770

services:
  postgres:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: vmcp
      POSTGRES_PASSWORD: vmcp
      POSTGRES_DB: vmcp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vmcp"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-plane:
    <<: *app-security
    build:
      context: ../core
      args:
        SERVICE: control-plane
    environment:
      <<: [*master-key, *network-policy]
      VMCP_CP_ADDR: ":8081"
      # DEV ONLY default; set VMCP_ADMIN_TOKEN to a strong secret in real deployments.
      VMCP_ADMIN_TOKEN: ${VMCP_ADMIN_TOKEN:-dev-admin-token}
      VMCP_DATABASE_URL: postgres://vmcp:vmcp@postgres:5432/vmcp?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  # Optional: only for rate limits shared between data-plane nodes.
  # Start with `docker compose --profile redis up` and set VMCP_REDIS_URL=redis://redis:6379/0.
  redis:
    image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    profiles: [redis]

  data-plane:
    <<: *app-security
    stop_grace_period: 105s
    build:
      context: ../core
      args:
        SERVICE: data-plane
    environment:
      <<: [*master-key, *network-policy]
      VMCP_DP_ADDR: ":8080"
      VMCP_AUDIT_MODE: ${VMCP_AUDIT_MODE:-strict}
      VMCP_AUTH_MAX_STALE: ${VMCP_AUTH_MAX_STALE:-30s}
      VMCP_ALLOWED_ORIGINS: ${VMCP_ALLOWED_ORIGINS:-}
      VMCP_REDIS_URL: ${VMCP_REDIS_URL:-}
      VMCP_DATABASE_URL: postgres://vmcp:vmcp@postgres:5432/vmcp?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      control-plane:
        # The control plane applies migrations; the data plane only reads.
        condition: service_started

  web:
    <<: *app-security
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,uid=65532,gid=65532,mode=1770
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=1m,uid=65532,gid=65532,mode=0770
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=65532,gid=65532,mode=0770
    build:
      context: ../web
      args:
        VITE_PUBLIC_GATEWAY_URL: ${VMCP_PUBLIC_URL:-http://localhost:8080}
    ports:
      - "3000:8080"
    depends_on:
      - control-plane

volumes:
  pgdata:
