# Layer over docker-compose.yml; the secret is deliberately not given a public default.
services:
  control-plane:
    environment:
      VMCP_OMNI_URL: http://omni-mcp:8090
      VMCP_OMNI_PUBLIC_URL: ${VMCP_OMNI_PUBLIC_URL:-http://localhost:8090}
      VMCP_OMNI_SECRET: ${VMCP_OMNI_SECRET:?Set a random secret of at least 32 characters}
  data-plane:
    environment:
      VMCP_OMNI_ALLOW_ANONYMOUS: ${VMCP_OMNI_ALLOW_ANONYMOUS:-false}
      VMCP_OMNI_SECRET: ${VMCP_OMNI_SECRET:?Set a random secret of at least 32 characters}
  omni-mcp:
    build: {context: ../core, args: {SERVICE: omni-mcp}}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports: ["127.0.0.1:8090:8090"]
    environment:
      VMCP_OMNI_ALLOW_ANONYMOUS: ${VMCP_OMNI_ALLOW_ANONYMOUS:-false}
      VMCP_OMNI_DATA_PLANE_URL: http://data-plane:8080
      VMCP_OMNI_SECRET: ${VMCP_OMNI_SECRET:?Set a random secret of at least 32 characters}
      VMCP_OMNI_PUBLIC_URL: ${VMCP_OMNI_PUBLIC_URL:-http://localhost:8090}
      VMCP_OMNI_MIN_SIMILARITY: ${VMCP_OMNI_MIN_SIMILARITY:-0}
      VMCP_OMNI_SEARCH_LIMIT: ${VMCP_OMNI_SEARCH_LIMIT:-120}
      VMCP_OMNI_REFRESH_INTERVAL: ${VMCP_OMNI_REFRESH_INTERVAL:-30s}
      VMCP_TRUSTED_PROXIES: ${VMCP_TRUSTED_PROXIES:-}
      VMCP_OMNI_RERANK_URL: ${VMCP_OMNI_RERANK_URL:-}
      VMCP_OMNI_RERANK_MODEL: ${VMCP_OMNI_RERANK_MODEL:-}
      VMCP_OMNI_RERANK_KEY: ${VMCP_OMNI_RERANK_KEY:-}
      VMCP_OMNI_RERANK_TIMEOUT: ${VMCP_OMNI_RERANK_TIMEOUT:-5s}
      VMCP_OMNI_RERANK_CANDIDATES: ${VMCP_OMNI_RERANK_CANDIDATES:-20}
      VMCP_OMNI_RERANK_NO_MATCH_SCORE: ${VMCP_OMNI_RERANK_NO_MATCH_SCORE:-0}
      VMCP_OMNI_RERANK_CONFIDENCE_SCORE: ${VMCP_OMNI_RERANK_CONFIDENCE_SCORE:-0}
      VMCP_OMNI_RERANK_MIN_SCORE: ${VMCP_OMNI_RERANK_MIN_SCORE:-0}
      VMCP_OMNI_RERANK_FAILURE_POLICY: ${VMCP_OMNI_RERANK_FAILURE_POLICY:-fallback}
      VMCP_OMNI_RERANK_INSECURE_SKIP_VERIFY: ${VMCP_OMNI_RERANK_INSECURE_SKIP_VERIFY:-false}
      VMCP_OMNI_EMBEDDING_URL: ${VMCP_OMNI_EMBEDDING_URL:-}
      VMCP_OMNI_EMBEDDING_TEXT_FORMAT: ${VMCP_OMNI_EMBEDDING_TEXT_FORMAT:-legacy-v1}
      VMCP_OMNI_EMBEDDING_DIMENSIONS: ${VMCP_OMNI_EMBEDDING_DIMENSIONS:-0}
      VMCP_OMNI_EMBEDDING_REVISION: ${VMCP_OMNI_EMBEDDING_REVISION:-}
      VMCP_OMNI_EMBEDDING_QUERY_PREFIX: ${VMCP_OMNI_EMBEDDING_QUERY_PREFIX:-}
      VMCP_OMNI_EMBEDDING_DOCUMENT_PREFIX: ${VMCP_OMNI_EMBEDDING_DOCUMENT_PREFIX:-}
      VMCP_OMNI_EMBEDDING_MODEL: ${VMCP_OMNI_EMBEDDING_MODEL:-}
      VMCP_OMNI_EMBEDDING_INSECURE_SKIP_VERIFY: ${VMCP_OMNI_EMBEDDING_INSECURE_SKIP_VERIFY:-false}
      VMCP_OMNI_EMBEDDING_KEY: ${VMCP_OMNI_EMBEDDING_KEY:-}
      VMCP_AGENT_OIDC_ISSUER: ${VMCP_AGENT_OIDC_ISSUER:-}
    depends_on: {data-plane: {condition: service_started}}
