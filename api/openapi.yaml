  /api/v1/admin-tokens:
    get:
      tags: [ Admin Tokens ]
      operationId: listAdminTokens
      summary: List admin API tokens (metadata only)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ items ]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminToken" }
                  nextCursor:
                    type: [ string, "null" ]
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [ Admin Tokens ]
      operationId: createAdminToken
      summary: Create a named admin API token
      description: |
        For integrations. The secret (`token`) is returned **only in this response**.
        Scope `read` uses explicit permission assignments and grants no implicit access; `admin` grants platform administrator authority.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTokenCreate"
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "201":
          description: Created
          headers:
            Cache-Control: { schema: { type: string, examples: [ no-store ] } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTokenWithSecret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A token with this slug already exists.
        "422":
          $ref: "#/components/responses/Unprocessable"
      parameters:
        - $ref: "#/components/parameters/CSRF"

  /api/v1/admin-tokens/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [ Admin Tokens ]
      operationId: getAdminToken
      summary: Get an admin token (never includes the secret)
      responses:
        "200":
          description: OK
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [ Admin Tokens ]
      operationId: patchAdminToken
      summary: Update description, scope or expiry (JSON Merge Patch)
      description: '`expiresAt: null` clears the expiry.'
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/AdminTokenPatch"
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "200":
          description: Updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [ Admin Tokens ]
      operationId: deleteAdminToken
      summary: Delete an admin token
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /api/v1/admin-tokens/{slug}/rotate:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      tags: [ Admin Tokens ]
      operationId: rotateAdminToken
      summary: Issue a new secret; the old one stops working immediately
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "200":
          description: Rotated (new secret in `token`)
          headers:
            Cache-Control: { schema: { type: string, examples: [ no-store ] } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTokenWithSecret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IfMatch"

  /api/v1/admin-tokens/{slug}/revoke:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      tags: [ Admin Tokens ]
      operationId: revokeAdminToken
      summary: Revoke a token (idempotent)
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "200":
          description: Revoked
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IfMatch"

  /api/v1/revocations/jwts:
    post:
      tags: [ Identity Bindings ]
      operationId: revokeJWT
      summary: Revoke an IdP-issued agent JWT by raw token or SHA-256 hex digest
      description: Requires tenant runtime_jwts.revoke. Immediately invalidates the token across data-plane nodes on next sync.
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                token:
                  type: string
                  description: Raw JWT string (hashed with SHA-256 before storage; never stored in plaintext).
                tokenHash:
                  type: string
                  description: 64-character hex SHA-256 digest of the raw JWT.
                expiresAt:
                  type: string
                  format: date-time
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/revocations/sessions:
    post:
      tags: [ System ]
      operationId: revokeSessions
      summary: Revoke active OIDC browser sessions for a subject
      description: Requires tenant sessions.revoke. Revokes active browser sessions by exact issuer plus subject. Omitted issuer selects the configured OIDC provider, or legacy rows when no provider is configured. Explicit empty issuer selects only legacy records; no issuer is inferred or backfilled.
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ subject ]
              additionalProperties: false
              properties:
                subject:
                  type: string
                issuer:
                  type: string
                  maxLength: 2048
                  description: Exact recorded issuer; omit for the configured provider, or use an empty string for legacy rows.
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/audit-status:
    get:
      tags: [ Audit ]
      operationId: getAuditStatus
      summary: Read audit durability counters and incomplete operation backlog
      responses:
        "200":
          description: Process counters and persisted incomplete-operation counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditStatus" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/AuditUnavailable"

  /api/v1/audit-events:
    get:
      tags: [ Audit ]
      operationId: listAuditEvents
      summary: List audit events, newest first
      description: >-
        Returns authorized metadata only, never payload bodies. Event domains are always filtered before pagination and conversation
        aggregation. Sensitive identity/details fields are omitted without their
        permissions; identity filters require identity permission. Each event
        includes direction-specific payload capabilities. Responses use no-store.

      parameters:
        - { name: groupBy, in: query, description: Return server-aggregated conversation summaries. Groups exclude events without correlation; pagination uses the last group ID cursor. Active groups may move as new events arrive., schema: { type: string, enum: [ conversation ] } }
        - { name: conversationId, in: query, schema: { type: string, maxLength: 256 } }
        - { name: rootConversationId, in: query, schema: { type: string, maxLength: 256 } }
        - { name: turnId, in: query, schema: { type: string, maxLength: 256 } }
        - { name: conversationGroupId, in: query, schema: { type: string, maxLength: 256 } }
        - name: activity
          in: query
          description: Filter by recorded origin. Virtual includes virtual MCP events and explicitly linked upstream attempts; control includes control-plane reads/writes and their linked upstream attempts; system includes background activity; upstream selects upstream-scope events only. Omni includes Omni calls, discovery/model diagnostics and explicitly linked virtual/upstream descendants. Omit for all events, including unclassified legacy events.
          schema: { type: string, enum: [ virtual, control, system, upstream, omni ] }
        - $ref: "#/components/parameters/Limit"
        - name: cursor
          in: query
          description: '`nextCursor` from the previous page.'
          schema: { type: string }
        - { name: operationId, in: query, schema: { type: string, format: uuid } }
        - { name: requestId, in: query, schema: { type: string, format: uuid } }
        - { name: actorId, in: query, schema: { type: string } }
        - { name: stage, in: query, schema: { type: string, enum: [ event, admission, outcome, mutation ] } }
        - { name: incomplete, in: query, description: Admissions without a persisted outcome (includes in-flight calls)., schema: { type: boolean } }
        - { name: virtualServer, in: query, schema: { type: string } }
        - { name: agentKey, in: query, schema: { type: string } }
        - { name: subject, in: query, description: JWT `sub` of an OAuth-authenticated caller., schema: { type: string } }
        - { name: tool, in: query, schema: { type: string } }
        - name: status
          in: query
          schema: { type: string, enum: [ started, ok, tool_error, error, denied ] }
        - { name: from, in: query, description: Inclusive RFC 3339 lower bound., schema: { type: string, format: date-time } }
        - { name: to, in: query, description: Exclusive RFC 3339 upper bound., schema: { type: string, format: date-time } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ items ]
                properties:
                  items:
                    type: array
                    items: { oneOf: [ { $ref: "#/components/schemas/AuditEvent" }, { $ref: "#/components/schemas/AuditConversation" } ] }
                  capabilities:
                    type: object
                    properties:
                      canFilterIdentities: { type: boolean }
                  authorizationRevision: { type: integer, format: int64 }
                  nextCursor:
                    type: [ string, "null" ]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Authorization policy or audit storage unavailable
        "422":
          $ref: "#/components/responses/Unprocessable"

  /api/v1/export:
    get:
      tags: [ Declarative ]
      operationId: exportConfig
      summary: Export the whole configuration as a declarative document
      description: |
        Secrets are never included. The document can be committed to git and re-applied; stored
        upstream headers are preserved because `headers` is absent from it.
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "200":
          description: OK
          headers:
            X-VMCP-Config-Revision: { $ref: "#/components/headers/ConfigRevision" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesiredState"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/apply:
    post:
      tags: [ Declarative ]
      operationId: applyConfig
      summary: Make the configuration match a declarative document
      description: |
        Applied in a single transaction: either everything changes or nothing does.

        - Resources in the document are created or updated; unchanged ones are left alone.
        - With `prune=true`, resources **absent** from the document are deleted. Without it they
          are left untouched.
        - Tool schemas of new or changed upstreams are fetched before virtual servers are
          validated, unless `refreshTools=false`.
        - `dryRun=true` validates and reports the plan without changing anything.
      parameters:
        - name: prune
          in: query
          schema:
            type: boolean
            default: false
        - name: dryRun
          in: query
          schema:
            type: boolean
            default: false
        - name: refreshTools
          in: query
          schema:
            type: boolean
            default: true
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DesiredState"
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "200":
          description: Applied (or planned, when `dryRun`)
          headers:
            X-VMCP-Config-Revision: { $ref: "#/components/headers/ConfigRevision" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplyResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
  /api/v1/upstreams/{slug}/connection-test:
    post:
      tags:
        - Upstreams
      operationId: testStoredConnection
      summary: Test stored upstream credentials without returning them
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "200":
          description: Sanitized outcome
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                additionalProperties: false
                properties:
                  ok:
                    type: boolean
                  error:
                    type: string
                  toolCount:
                    type: integer
                  latencyMs:
                    type: integer
                  protocolVersion:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/AuditUnavailable"
  /api/v1/upstreams/{slug}/catalog:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags:
        - Upstreams
      operationId: listUpstreamCatalog
      summary: Read discovered resources, templates, prompts and capabilities
      responses:
        "200":
          description: Complete bounded discovery catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Catalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/upstreams/{slug}/rest/preview:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      tags:
        - Upstreams
      operationId: previewRESTOperation
      summary: Preview a saved REST operation without sending it
      description: Validates arguments and returns the prepared URL/body with masked header values. No network access or impersonation. Editor or admin required.
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RESTOperationRequest"
      responses:
        "200":
          description: Prepared request with redacted headers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RESTPreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/AuditUnavailable"
  /api/v1/upstreams/{slug}/rest/test:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      tags:
        - Upstreams
      operationId: testRESTOperation
      summary: Execute a saved REST operation once (admin only)
      description: Real operation with possible side effects. Requires admin, enabled upstream and matching If-Match. Never impersonates an agent; identity-required operations must be tested through MCP. No retries. Errors are sanitized MCP tool results.
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RESTOperationRequest"
      responses:
        "200":
          description: MCP tool result; isError indicates REST failure
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/AuditUnavailable"
  /api/v1/rest-imports:
    post:
      tags:
        - Upstreams
      operationId: previewRESTImport
      summary: Analyze OpenAPI/Swagger operations without saving or contacting a service
      description: Editor/admin only. Upload document contents as a string. Returns selectable REST operation definitions and per-operation compatibility warnings/errors. Use existing upstream CRUD with the explicitly selected operations to save; existing REST validation, credentials, ETags and audit controls still apply. No credentials, headers, TLS settings or agent identity forwarding are imported. Unsupported media, methods, serialization, external or recursive references are not silently converted.
      parameters:
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RESTImportRequest"
      responses:
        "200":
          description: Analysis preview; configuration remains unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RESTImportResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "503":
          $ref: "#/components/responses/AuditUnavailable"

  /omni:
    get:
      operationId: getOmniStatus
      summary: Omni connection and index status (index details require admin)
      responses:
        "200":
          description: Omni configuration
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /omni/reindex:
    post:
      operationId: refreshOmniIndex
      summary: Request an asynchronous index refresh (admin only)
      responses:
        "200":
          description: Refresh requested
          content:
            application/json:
              schema: { type: object, properties: { accepted: { type: boolean } } }
  /omni/preview:
    post:
      operationId: previewOmniDiscovery
      summary: Discover tools or read a schema using an explicit runtime identity
      parameters:
        - in: header
          name: X-VMCP-Runtime-Authorization
          required: true
          schema: { type: string }
          description: Bearer agent key or OAuth access token; never the management credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                query: { type: string, maxLength: 4096 }
                tool_ref: { type: string }
      responses:
        "200":
          description: Authorized matches or published schema; never executes tools
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "403":
          description: Console permission denied, or runtime_access_denied when the separately supplied runtime identity is rejected
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/permissions:
    get:
      operationId: listAuthorizationPermissions
      summary: List the fixed permission catalog (platform admin)
      responses:
        "200":
          description: Catalog; Capture restrictions require explicit assignment scopes
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuthorizationPermission"
        "401": &a1
          $ref: "#/components/responses/Unauthorized"
        "403": &a2
          description: Platform admin required
  /api/v1/roles:
    get:
      operationId: listAuthorizationRoles
      summary: List builtin and custom roles (platform admin)
      responses:
        "200":
          description: Roles from a coherent policy snapshot; no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - authorizationRevision
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuthorizationRole"
                  authorizationRevision:
                    type: integer
        "401": *a1
        "403": *a2
    post:
      operationId: createAuthorizationRole
      summary: Create a custom role or freeze a copy of an existing role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationRoleInput"
      responses:
        "201":
          description: Created; ETag and Location headers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationRole"
        "401": *a1
        "403": *a2
        "409":
          description: Slug already exists
        "422":
          description: Invalid role input
  /api/v1/roles/{slug}:
    get:
      operationId: getAuthorizationRole
      summary: Read a role (platform admin)
      parameters:
        - &a3
          $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Role with ETag; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationRole"
        "401": *a1
        "403": *a2
        "404":
          description: Role not found
    put:
      operationId: updateAuthorizationRole
      summary: Replace a custom role; builtin roles are immutable
      parameters:
        - *a3
        - &a4
          name: If-Match
          in: header
          required: true
          description: Explicit numeric ETag; missing or wildcard returns 428, stale
            version returns 412.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationRoleInput"
      responses:
        "200":
          description: Updated role and ETag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationRole"
        "401": *a1
        "403": *a2
        "404":
          description: Role not found
        "409":
          description: Assignments require capture scopes before payload permission can be
            added
        "412":
          description: Stale ETag
        "422":
          description: Invalid input
        "428":
          description: Explicit If-Match required
    delete:
      operationId: deleteAuthorizationRole
      summary: Delete an unassigned custom role; builtin roles are protected
      parameters:
        - *a3
        - *a4
      responses:
        "204":
          description: Deleted
        "401": *a1
        "403": *a2
        "404":
          description: Role not found
        "409":
          description: Role has assignments, including disabled assignments
        "412":
          description: Stale ETag
        "428":
          description: Explicit If-Match required

  /api/v1/role-assignments:
    get:
      operationId: listAuthorizationAssignments
      summary: List direct and mapping role assignments (platform admin)
      description: Coherent policy snapshot; filters precede pagination; no-store.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: enabled
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Assignments and authorization revision
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuthorizationAssignment"
                  nextCursor:
                    type:
                      - string
                      - "null"
                  authorizationRevision:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Global platform admin required
        "422":
          description: Invalid input or scope
    post:
      operationId: createAuthorizationAssignment
      summary: Create a scoped role assignment (platform admin)
      description: Audit resource scopes pin the
        current epoch unless an explicit recorded epoch is supplied. Project
        scopes pin ownership. Enabled OIDC assignments require the configured
        issuer; enabled token assignments require an active immutable token ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationAssignmentInput"
      responses:
        "201":
          description: Created assignment, ETag and Location; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Global platform admin required
        "422":
          description: Invalid input or scope
  /api/v1/role-assignments/{id}:
    get:
      operationId: getAuthorizationAssignment
      summary: Read an assignment with its pinned scope (platform admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Assignment and ETag; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Global platform admin required
        "404":
          description: Assignment not found
        "422":
          description: Invalid input or scope
    put:
      operationId: updateAuthorizationAssignment
      summary: Replace a role assignment (platform admin)
      description: Omitting an existing resource epoch or project owner on the same
        scope preserves its pin. Changing scope or supplying an explicit validated
        pin is an intentional regrant. Assignments grant permissions, never platform
        administrator identity; the final operator assignment may be revoked.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationAssignmentInput"
      responses:
        "200":
          description: Updated assignment and ETag; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Global platform admin required
        "404":
          description: Assignment not found
        "412":
          description: Stale ETag
        "422":
          description: Invalid input or scope
        "428":
          description: Explicit numeric If-Match required; wildcard is rejected
    delete:
      operationId: deleteAuthorizationAssignment
      summary: Delete a role assignment (platform admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Global platform admin required
        "404":
          description: Assignment not found
        "412":
          description: Stale ETag
        "422":
          description: Invalid input or scope
        "428":
          description: Explicit numeric If-Match required; wildcard is rejected
  /api/v1/access/scopes:
    get:
      operationId: listAuthorizationScopes
      summary: List immutable IDs for scope and token selection (platform admin)
      description: Live resources and active tokens only; no credentials or token
        secrets. Resource options include the current epoch. All responses are
        no-store.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum:
              - team
              - project
              - upstream
              - virtual_server
              - control_token
      responses:
        "200":
          description: Scope options
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuthorizationScopeOption"
                  nextCursor:
                    type:
                      - string
                      - "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Global platform admin required
        "422":
          description: Invalid input or scope
  /api/v1/access/resource-epochs:
    get:
      operationId: listAuthorizationResourceEpochs
      summary: List current and historical resource ownership epochs (platform admin)
      description: Supports deleted resources by immutable UUID. This does not
        classify or backfill legacy audit events. All responses are no-store.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum:
              - upstream
              - virtual_server
        - name: resourceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Recorded epochs
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuthorizationResourceEpoch"
                  nextCursor:
                    type:
                      - string
                      - "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Global platform admin required
        "422":
          description: Invalid input or scope

  /api/v1/identity-mappings:
    get:
      operationId: listAuthorizationMappings
      summary: List claim/scope mappings (platform admin)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: enabled
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Coherent policy snapshot, filtered before pagination; no-store
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - nextCursor
                  - authorizationRevision
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuthorizationMapping"
                  nextCursor:
                    type:
                      - string
                      - "null"
                  authorizationRevision:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Global platform admin required
        "422":
          description: Invalid input, unknown permission, unsupported sample or issuer
            outside the configured provider
    post:
      operationId: createAuthorizationMapping
      summary: Create an OIDC claim/scope mapping (platform admin)
      description: Does not add trusted issuers or authenticate external OAuth
        bearers. Enabled mappings must exactly match the configured provider
        issuer; disabled drafts may be staged before configuring SSO. Conditions
        are ANDed. Enabled defaults to false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationMappingInput"
      responses:
        "201":
          description: Created mapping, ETag and Location; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationMapping"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Global platform admin required
        "422":
          description: Invalid input, unknown permission, unsupported sample or issuer
            outside the configured provider
  /api/v1/identity-mappings/{id}:
    get:
      operationId: getAuthorizationMapping
      summary: Read a versioned mapping (platform admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Mapping and ETag; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationMapping"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Global platform admin required
        "404":
          description: Mapping not found
        "422":
          description: Invalid input, unknown permission, unsupported sample or issuer
            outside the configured provider
    put:
      operationId: updateAuthorizationMapping
      summary: Replace a claim/scope mapping (platform admin)
      description: Enabled assignments prevent changing their mapping to an untrusted
        issuer. Mappings grant scoped permissions, never platform administrator
        identity. The final operator mapping may be disabled or reconditioned;
        referenced mappings still cannot be deleted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          description: Explicit numeric ETag; missing or wildcard returns 428; stale
            version returns 412.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationMappingInput"
      responses:
        "200":
          description: Updated mapping and ETag; no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationMapping"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Global platform admin required
        "404":
          description: Mapping not found
        "409":
          description: Enabled assignments prevent changing the mapping to an untrusted issuer
        "412":
          description: Stale ETag
        "422":
          description: Invalid input, unknown permission, unsupported sample or issuer
            outside the configured provider
        "428":
          description: Explicit numeric If-Match required
    delete:
      operationId: deleteAuthorizationMapping
      summary: Delete an unreferenced mapping (platform admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          description: Explicit numeric ETag; missing or wildcard returns 428; stale
            version returns 412.
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Global platform admin required
        "404":
          description: Mapping not found
        "409":
          description: Assignments refer to the mapping, including disabled assignments
        "412":
          description: Stale ETag
        "422":
          description: Invalid input, unknown permission, unsupported sample or issuer
            outside the configured provider
        "428":
          description: Explicit numeric If-Match required
  /api/v1/access/evaluate:
    post:
      operationId: evaluateAuthorization
      summary: Simulate stored permission policy with sample claims (platform admin)
      description: What-if only. Does not validate authentication, audience,
        signatures or claim freshness, issue cookies/tokens, or alter
        sessions or assignments. OIDC principal issuer must be the configured
        provider. Samples cannot establish trust. Named token IDs must be active.
        Claims are typed samples, not raw tokens; sample iss/sub, if present, must
        agree with the selected principal. Resource ownership is read from DB.
        Audit visibility requires an existing event ID; only immutable
        metadata/provenance is read, never ciphertext. Only stored assignments are
        simulated; platform administrator identity authority is not inferred. A
        positive policy result is not a promise of live
        configuration access. Payload directions are checked separately. Samples
        and results are excluded from audit payload capture.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizationEvaluationInput"
      responses:
        "200":
          description: Policy-only decision with revision and explicit simulation flags;
            no-store; no sample claims echoed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationEvaluation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Global platform admin required
        "404":
          description: Resource or event not found
        "422":
          description: Invalid input, unknown permission, unsupported sample or issuer
            outside the configured provider
  /api/v1/access/status:
    get:
      operationId: getAuthorizationStatus
      summary: Inspect authorization migration state (platform admin)
      description: Read-only counts and operational diagnostics from one repeatable-read
        snapshot. Does not change permissions, backfill historical contexts or
        certify working administrator logins. Configuration enforcement is not
        connected yet; configurationEnforcementReady is false. claimMappings
        reports live-audit only when encrypted server claim sessions are configured. The endpoint itself produces
        ordinary audit metadata.
      responses:
        "200":
          description: State and aggregate counters; no-store; no subjects, condition
            values or credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizationStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Global platform admin required
        "422":
          description: Invalid input, unknown permission, unsupported sample or issuer
            outside the configured provider

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bootstrap or named scoped administration API token. Agent OAuth tokens do not authenticate this API.
    cookieAuth:
      type: apiKey
      in: cookie
      name: vmcp_session_v2
      description: Signed server-session reference only. Sensitive typed claims remain encrypted in PostgreSQL. Old vmcp_session cookies require sign-in again. Unsafe methods require X-VMCP-CSRF.

  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Slug"
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag from a previous read. The write fails with 412 if the resource changed since.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `nextCursor`.
      schema: { type: string }
    CSRF:
      name: X-VMCP-CSRF
      in: header
      required: false
      description: Required with cookie authentication on unsafe methods.
      schema:
        type: string
        minLength: 1

  headers:
    ETag:
      description: Strong validator of the current resource state.
      schema: { type: string, examples: [ '"7"' ] }
    ConfigRevision:
      description: Global configuration revision after this operation.
      schema: { type: integer, format: int64 }

  responses:
    AuditUnavailable:
      description: Audit admission or outcome persistence failed. An already admitted operation may have completed; reconcile using X-Request-Id before retrying a non-idempotent action.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: "The token is valid but its scope does not allow this request (`code: forbidden`)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: "Resource not found (`code: not_found`)."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Slug already exists (`already_exists`) or resource still referenced (`in_use`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: '`If-Match` did not match the current ETag (`code: precondition_failed`).'
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unprocessable:
      description: |
        Well-formed but invalid. `errors` lists every problem, not just the first.
        Codes: `validation_failed`, `unknown_upstream`, `unknown_tool`, `duplicate_exposed_name`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    InvocationSecurity:
      type: object
      additionalProperties: false
      required:
        - revision
        - services
        - upstreams
      properties:
        revision:
          type: integer
          minimum: 1
        services:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/InvocationApprovalService"
        upstreams:
          type: object
          description: Stable upstream UUID to policy. Resolve IDs using /access/scopes?kind=upstream.
          additionalProperties:
            $ref: "#/components/schemas/UpstreamInvocationPolicy"
    SharedInvocationUpdate:
      type: object
      required: [revision, services]
      properties:
        revision: {type: integer, minimum: 1}
        services:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/InvocationApprovalService"
    SharedInvocationServices:
      allOf:
        - $ref: "#/components/schemas/SharedInvocationUpdate"
        - type: object
          required: [inUse]
          properties:
            inUse:
              type: array
              items: {type: string}
    UpstreamInvocationPolicy:
      allOf:
        - $ref: "#/components/schemas/InvocationRule"
        - type: object
          properties:
            tools:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/InvocationRule"
            services:
              type: object
              description: Local services usable only by this upstream. Names must be distinct from shared service names.
              additionalProperties:
                $ref: "#/components/schemas/InvocationApprovalService"
    UpstreamInvocationUpdate:
      type: object
      required: [upstreamId, revision, policy]
      properties:
        upstreamId: {type: string, format: uuid}
        revision: {type: integer, minimum: 0}
        policy:
          $ref: "#/components/schemas/UpstreamInvocationPolicy"
    UpstreamInvocationSecurity:
      allOf:
        - $ref: "#/components/schemas/UpstreamInvocationUpdate"
        - type: object
          required: [sharedServices, tools, callerContextFields]
          properties:
            sharedServices:
              type: array
              items: {type: string}
            tools:
              type: array
              items: {type: string}
            callerContextFields:
              type: array
              items: {type: string}
    InvocationRule:
      type: object
      properties:
        retry:
          type: string
          enum: [never, once]
          description: Operator-controlled transport replay. Absent inherits the upstream setting, default never. Tool override is explicit; upstream annotations never authorize retry. Only MCP calls without approval or caller-context verification are eligible.
        readOnly:
          type: boolean
          description: Operator classification for read-only tool filters, independent of retry. Absent inherits the upstream setting, default false. Does not prevent an upstream from writing; constrain its credentials.
        identity:
          type: object
          required: [source]
          description: Explicit user identity source; tools inherit and cannot replace an upstream identity policy. No automatic fallback. Caller context requires a verification service and fields configured on the upstream.
          properties:
            source:
              type: string
              enum: [oauth_subject, caller_context]
            service:
              type: string
              description: Required only for caller_context; references a configured service.
            fields:
              type: array
              minItems: 1
              maxItems: 16
              items: {type: string}
              description: Required only for caller_context; selected upstream caller context field names.
        stepUp:
          type: object
          required:
            - acceptedAcrValues
            - maxAgeSeconds
          properties:
            acceptedAcrValues:
              type: array
              minItems: 1
              items:
                type: string
            maxAgeSeconds:
              type: integer
              minimum: 1
              maximum: 86400
        approvalServices:
          type: array
          items:
            type: string
        shareFields:
          type: array
          description: Explicit top-level argument allowlist; raw bearer tokens are never shared.
          items:
            type: string
    InvocationApprovalService:
      type: object
      required:
        - url
        - approvalOrigin
      properties:
        authType:
          type: string
          enum: [bearer, oauth_client_credentials, headers, none]
          default: bearer
          description: Omitted preserves legacy Bearer authentication. Modes are mutually exclusive.
        timeoutSeconds:
          type: integer
          minimum: 0
          maximum: 60
          default: 2
          description: Per-phase deadline including OAuth token acquisition. Zero or omitted means 2 seconds.
        headers:
          type: object
          maxProperties: 16
          additionalProperties: {type: string, maxLength: 8192}
          description: Headers mode only. Values are write-only; reads return blank values and hasHeaders flags. Blank existing values retain secrets only for unchanged endpoint, CA and authentication mode. Omit a key to remove it. Transport/proxy/security headers are reserved; Authorization is permitted.
        hasHeaders:
          type: object
          readOnly: true
          additionalProperties: {type: boolean}
        oauth:
          type: object
          required: [tokenUrl, clientId]
          properties:
            tokenUrl: {type: string, format: uri, description: HTTPS token endpoint.}
            clientId: {type: string, maxLength: 2048}
            clientSecret: {type: string, writeOnly: true, maxLength: 8192}
            hasClientSecret: {type: boolean, readOnly: true}
            scopes:
              type: array
              maxItems: 50
              items: {type: string}
            audience: {type: string, maxLength: 2048}
            authStyle:
              type: string
              enum: [client_secret_basic, client_secret_post]
              default: client_secret_basic
        url:
          type: string
          format: uri
        approvalOrigin:
          type: string
          format: uri
        token:
          type: string
          writeOnly: true
        hasToken:
          type: boolean
          readOnly: true
        caPem:
          type: string
    AuthorizationMappingCondition:
      type: object
      additionalProperties: false
      required:
        - path
        - operator
        - value
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 512
          description: Exact full claim key takes precedence over dotted nested lookup.
        operator:
          type: string
          enum:
            - equals
            - array_contains
            - scope_contains
        value:
          type: string
          minLength: 1
          maxLength: 2048
          description: equals requires string equality; array_contains requires an array
            string element; scope_contains requires one exact whitespace-delimited
            scope token in a string claim.
    AuthorizationMappingInput:
      type: object
      additionalProperties: false
      required:
        - issuer
        - principalKind
        - conditions
      properties:
        issuer:
          type: string
          minLength: 1
          maxLength: 2048
        principalKind:
          type: string
          enum:
            - oidc
        conditions:
          type: array
          minItems: 1
          maxItems: 32
          uniqueItems: true
          items:
            $ref: "#/components/schemas/AuthorizationMappingCondition"
        enabled:
          type: boolean
          default: false
    AuthorizationMapping:
      type: object
      required:
        - id
        - issuer
        - principalKind
        - conditions
        - enabled
        - version
