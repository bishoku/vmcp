openapi: 3.1.0
info:
  title: vMCP Control Plane API
  version: 2.1.2
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: |
    Configuration API of the vMCP gateway. The web UI is a client of this API:
    **everything the UI can do, an external system can do.**

    ## Design principles for integrations

    - **Stable identifiers.** Resources are addressed by `slug` (client-chosen, immutable),
      never by generated IDs, so scripts and pipelines can refer to them before they exist.
    - **Idempotent writes.** `PUT /{resource}/{slug}` creates or replaces (201 on create, 200 on
      replace). Repeating the same call is safe.
    - **Declarative mode.** `GET /export` and `POST /apply` move the whole configuration as one
      document, atomically, with `dryRun` and optional `prune`. This is the intended GitOps path.
    - **Secrets are write-only.** Upstream `headers` values are never returned. Responses expose
      only `headerNames`. On writes, omitting `headers` keeps the stored secret, so exported
      documents can be re-applied without ever containing secrets.
    - **Optimistic concurrency.** Every resource carries an `ETag`. Send it back in `If-Match`
      on `PUT`/`PATCH`/`DELETE` to avoid lost updates (`412` on mismatch). `If-Match` is optional.
    - **Machine-readable errors.** All errors are `application/problem+json` (RFC 9457) with a
      stable `code`.
    - **Propagation.** Mutating responses carry `X-VMCP-Config-Revision`. The data plane serves
      the change once it has loaded that revision (normally well under a second).

    ## Naming rule

    Tools are exposed to agents as `{upstreamSlug}__{tool}` unless an `alias` is given.
    Slugs cannot contain `_`, so `__` is an unambiguous separator.

    ## Tenancy

    Single tenant (`default`) today. The data model is tenant-scoped, and tenant selection
    will be added without changing these paths.
servers:
  - url: http://localhost:8081
    description: Local development
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: Identity Bindings
    description: Map IdP-issued JWT claims to virtual servers (OAuth for agents).
  - name: Upstreams
    description: Physical MCP servers the gateway connects to.
  - name: Virtual Servers
    description: Agent-facing endpoints exposing a chosen set of upstream tools.
  - name: Agent Keys
    description: API keys agents use to authenticate to virtual servers.
  - name: Admin Tokens
    description: Named credentials for the admin API, for integrations.
  - name: Audit
    description: Tool admissions, outcomes and transactional administrative mutations. Payloads are never stored.
  - name: Declarative
    description: Whole-configuration export and apply.
  - name: System
    description: Server information.

paths:
  /invocation-security:
    get:
      operationId: getInvocationSecurity
      summary: Read invocation security policies
      description: Requires tenant invocation_security.read.
      responses:
        "200": &a1
          description: Invocation policies with service secrets omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvocationSecurity"
    put:
      operationId: putInvocationSecurity
      summary: Replace invocation security policies
      description: Requires tenant invocation_security.manage. Revision must match. Omitted service tokens retain their current value. Upstream UUIDs bind rules independently of aliases. Inherited requirements cannot be weakened.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvocationSecurity"
      responses:
        "200": *a1
        "412":
          description: Revision conflict
        "422":
          description: Invalid policy
  /invocation-security/shared-services:
    get:
      operationId: getSharedInvocationServices
      summary: Read tenant-managed invocation services
      description: Requires tenant invocation_security.read.
      responses:
        "200": &sharedInvocationResponse
          description: Shared services and names referenced by upstream or tool policies. Service tokens are omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedInvocationServices"
    put:
      operationId: putSharedInvocationServices
      summary: Replace tenant-managed invocation services
      description: Requires tenant invocation_security.manage. The document revision must match. Upstream policies and local services stay outside this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharedInvocationUpdate"
      responses:
        "200": *sharedInvocationResponse
        "412":
          description: Revision conflict.
        "422":
          description: Invalid or referenced service.
  /upstreams/{slug}/invocation-security:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      operationId: getUpstreamInvocationSecurity
      summary: Read an upstream's invocation policy and available services
      description: Requires upstream-scoped upstreams.invocation_security.read.
      responses:
        "200": &upstreamInvocationResponse
          description: Scoped policy and editor options. Service tokens are omitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamInvocationSecurity"
    put:
      operationId: putUpstreamInvocationSecurity
      summary: Replace an upstream's invocation policy and local services
      description: Requires upstream-scoped upstreams.invocation_security.manage. The upstream ID and revision must match. Omitted tokens retain their current value at the same endpoint. New tool rules must use names from this upstream's catalog.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpstreamInvocationUpdate"
      responses:
        "200": *upstreamInvocationResponse
        "412":
          description: The upstream or policy revision changed.
        "422":
          description: Invalid policy or service.
  /teams:
    get:
      operationId: listTeams
      summary: List visible teams
      responses:
        "200":
          description: Visible records
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Team" }
    post:
      operationId: saveTeam
      summary: Create or update a team; version required for existing records
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Team" }
      responses:
        "200": { description: Saved }
        "403": { description: Outside caller ownership scope }
        "412": { description: Stale version }
  /projects:
    get:
      operationId: listProjects
      summary: List visible projects
      responses:
        "200":
          description: Visible records
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
    post:
      operationId: saveProject
      summary: Create or update a project; version required for existing records
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Project" }
      responses:
        "200": { description: Saved }
        "403": { description: Outside caller ownership scope }
        "412": { description: Stale version }
  /tool-grants:
    get:
      operationId: listToolGrants
      summary: List visible tool-grants
      responses:
        "200":
          description: Visible records
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ToolGrant" }
    post:
      operationId: saveToolGrant
      summary: Create or update a tool grant; version required for existing records
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToolGrant" }
      responses:
        "200": { description: Saved }
        "403": { description: Outside caller ownership scope }
        "412": { description: Stale version }
  /tool-grants/bulk:
    post:
      operationId: bulkToolGrants
      summary: Request or decide tool access in bulk with per-item ownership and version checks
      description: Each item is committed independently and audited through the normal mutation path. Inspect every result; do not automatically replay successful items. Rejected/revoked decisions require a reason. Existing records require their current version. Duplicate identities invalidate the entire batch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              additionalProperties: false
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: "#/components/schemas/ToolGrant" }
      responses:
        "200":
          description: Per-item outcomes, including partial failures
          content:
            application/json:
              schema:
                type: object
                required: [items, changed, unchanged, failed]
                properties:
                  changed: { type: integer }
                  unchanged: { type: integer }
                  failed: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      required: [virtualServer, upstream, tool, result]
                      properties:
                        virtualServer: { type: string }
                        upstream: { type: string }
                        tool: { type: string }
                        result: { type: string, enum: [changed, unchanged, failed] }
                        code: { type: string }
                        message: { type: string }
        "422": { description: Empty, oversized, duplicate batch or missing decision reason }
  /tool-catalog:
    get:
      operationId: listSharedToolMetadata
      summary: List tool metadata without upstream connection details
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: Tool metadata page
          content:
            application/json:
              schema:
                type: object
                properties:
                  nextCursor: { type: [string, "null"] }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        upstream: { type: string }
                        ownerTeam: { type: string }
                        name: { type: string }
                        description: { type: string }
  /api/v1/upstreams/{slug}/audit-settings:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [ Audit ]
      operationId: getUpstreamLocalAuditSettings
      summary: Get only this resource's local masking rules
      description: |
        Requires audit.settings.read for GET or audit.redaction.local.update for PUT on the live
        resource. These resource checks always apply.
        Never returns global settings or another resource's rules. PUT preserves all other settings
        and uses the shared settings revision; stale revisions return 409. Bodies are excluded from audit capture.
      responses:
        "200":
          description: Local rules and common policy revision; no-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalAuditSettings' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
        "412": { $ref: '#/components/responses/PreconditionFailed' }
    put:
      tags: [ Audit ]
      operationId: saveUpstreamLocalAuditSettings
      summary: Save only this resource's local masking rules
      description: |
        Requires audit.settings.read for GET or audit.redaction.local.update for PUT on the live
        resource. These resource checks always apply.
        Never returns global settings or another resource's rules. PUT preserves all other settings
        and uses the shared settings revision; stale revisions return 409. Bodies are excluded from audit capture.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalAuditSettings' }
      responses:
        "200":
          description: Local rules and common policy revision; no-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalAuditSettings' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
        "412": { $ref: '#/components/responses/PreconditionFailed' }
  /api/v1/upstreams/{slug}/audit-settings/preview:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [ Audit ]
      operationId: previewUpstreamLocalAuditSettings
      summary: Preview local rules with server-controlled global protection
      description: |
        Requires audit.settings.read and audit.redaction.preview on the live resource.
        Applies current global and mandatory rules, fixes resource and capture scope from the route,
        and accepts only synthetic samples. No saved messages are read and samples are not captured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ revision, rules, direction, payload ]
              properties:
                revision: { type: integer }
                rules:
                  type: array
                  maxItems: 20
                  items: { $ref: '#/components/schemas/AuditMaskRule' }
                direction: { type: string, enum: [ request, response ] }
                payload: {}
      responses:
        "200":
          description: Synthetic preview; no-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPreview' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
  /api/v1/virtual-servers/{slug}/audit-settings:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [ Audit ]
      operationId: getVirtualServerLocalAuditSettings
      summary: Get only this resource's local masking rules
      description: |
        Requires audit.settings.read for GET or audit.redaction.local.update for PUT on the live
        resource. These resource checks always apply.
        Never returns global settings or another resource's rules. PUT preserves all other settings
        and uses the shared settings revision; stale revisions return 409. Bodies are excluded from audit capture.
      responses:
        "200":
          description: Local rules and common policy revision; no-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalAuditSettings' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
        "412": { $ref: '#/components/responses/PreconditionFailed' }
    put:
      tags: [ Audit ]
      operationId: saveVirtualServerLocalAuditSettings
      summary: Save only this resource's local masking rules
      description: |
        Requires audit.settings.read for GET or audit.redaction.local.update for PUT on the live
        resource. These resource checks always apply.
        Never returns global settings or another resource's rules. PUT preserves all other settings
        and uses the shared settings revision; stale revisions return 409. Bodies are excluded from audit capture.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalAuditSettings' }
      responses:
        "200":
          description: Local rules and common policy revision; no-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalAuditSettings' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
        "412": { $ref: '#/components/responses/PreconditionFailed' }
  /api/v1/virtual-servers/{slug}/audit-settings/preview:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [ Audit ]
      operationId: previewVirtualServerLocalAuditSettings
      summary: Preview local rules with server-controlled global protection
      description: |
        Requires audit.settings.read and audit.redaction.preview on the live resource.
        Applies current global and mandatory rules, fixes resource and capture scope from the route,
        and accepts only synthetic samples. No saved messages are read and samples are not captured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ revision, rules, direction, payload ]
              properties:
                revision: { type: integer }
                rules:
                  type: array
                  maxItems: 20
                  items: { $ref: '#/components/schemas/AuditMaskRule' }
                direction: { type: string, enum: [ request, response ] }
                payload: {}
      responses:
        "200":
          description: Synthetic preview; no-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPreview' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
  /api/v1/admission-settings:
    get:
      operationId: getAdmissionSettings
      summary: Read pod-local concurrency protection
      description: Requires tenant admission.read. Defaults are 1024 total, 128 per virtual server and 16 per principal per data-plane pod.
      responses:
        "200":
          description: Current settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdmissionSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putAdmissionSettings
      summary: Update pod-local concurrency protection
      description: Requires tenant admission.update, granted to the platform-operator template. Supply the current revision. Changes propagate through configuration snapshots and apply to new admissions without cancelling running work. Limits are per pod, not distributed quotas. Server and principal limits must not exceed total.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdmissionSettings" }
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdmissionSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Revision conflict; reload before saving }
        "422": { description: Invalid settings }
  /api/v1/audit-settings:
    get:
      tags:
        - Audit
      operationId: getAuditSettings
      summary: Read audit capture and masking settings
      description: Requires tenant audit.settings.read. Audit durability settings are independent of authorization.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditSettings"
        "401": &a1
          $ref: "#/components/responses/Unauthorized"
        "403": &a2
          $ref: "#/components/responses/Forbidden"
    put:
      tags:
        - Audit
      operationId: putAuditSettings
      summary: Replace audit settings
      description: Requires the corresponding tenant audit settings permissions. Supply the current revision; stale settings return 409.
        New operations use the saved policy after snapshot propagation. Existing
        operations retain their mode and policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditSettings"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditSettings"
        "401": *a1
        "403": *a2
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/audit-preview:
    post:
      tags:
        - Audit
      operationId: previewAuditPayload
      summary: Preview an audit payload with unsaved masking rules
      description: Requires tenant audit.settings.read and audit.redaction.preview. Uses the production masking engine, mandatory secret
        filters and selected global/virtual-server/upstream rules. Samples and
        preview results are excluded from audit payload capture.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditPreviewInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPreview"
        "401": *a1
        "403": *a2
        "422":
          $ref: "#/components/responses/Unprocessable"
  /api/v1/audit-events/{event}/payload:
    get:
      tags:
        - Audit
      operationId: getAuditPayload
      summary: Read an audit payload
      description: >-
        Requires explicit resource-scoped request or response permissions with
        capture-scope restrictions. Historical records without
        verified context require tenant-level legacy permissions; unclassified
        records require a separate grant. Platform administrators have explicit full access. Policy, event context and direction are checked before ciphertext is
        loaded. Denied and missing events always return the same 404.
        Access is audited without recursively capturing returned content. Responses
        use Cache-Control no-store. Released payloads return state without content.
      parameters:
        - in: path
          name: event
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPayload"
        "401": *a1
        "403": *a2
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Authorization, audit persistence or payload encryption unavailable
  /api/v1/openapi.json:
    get:
      tags: [ System ]
      operationId: downloadOpenAPIJSON
      summary: Download the control plane OpenAPI specification as JSON
      responses:
        '200':
          description: OpenAPI 3.1 specification shipped with this server
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
  /api/v1/openapi.yaml:
    get:
      tags: [ System ]
      operationId: downloadOpenAPIYAML
      summary: Download the control plane OpenAPI specification as YAML
      responses:
        '200':
          description: OpenAPI 3.1 specification shipped with this server
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/configuration-access:
    post:
      tags: [ System ]
      operationId: checkOwnConfigurationAccess
      summary: Inspect the caller's current configuration affordances
      description: |
        Evaluates only the authenticated caller against current server-held policy and live resource facts.
        Returns booleans, no resource data, raw claims or assignments. A decision is advisory and never
        replaces authorization on the real request. Authorization always applies; there is no bypass mode.
        The body is excluded from audit payload capture and responses use no-store.
        Permission checks must belong to the matched configuration family, or ownership.transfer.
        A collection permission without a body reports whether any applicable grant exists; it does
        not authorize a target or replace the exact operation check. No policy state is changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ checks ]
              properties:
                checks:
                  type: array
                  maxItems: 64
                  items:
                    type: object
                    additionalProperties: false
                    required: [ method, path ]
                    properties:
                      method: { type: string, enum: [ GET, POST, PATCH, PUT, DELETE ] }
                      path: { type: string, description: Relative configuration API path without /api/v1. External URLs are denied. }
                      body: { type: object, additionalProperties: true }
                      permission: { type: string, description: Optional registered field/action permission for affordances. Omit to check the exact proposed operation. }
      responses:
        "200":
          description: Own decisions in request order; never a reusable authorization token.
          content:
            application/json:
              schema:
                type: object
                required: [ authorizationRevision, allowed ]
                properties:
                  authorizationRevision: { type: integer }
                  allowed:
                    type: array
                    items: { type: boolean }
        default:
          description: Authentication, validation or policy inspection failure.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /api/v1/me:
    get:
      tags: [ System ]
      operationId: getMe
      summary: The authenticated caller and its role
      description: |
        Returns authenticated identity labels; granular authorization always applies.
        Only platform `admin` has administrator authority. Other labels confer no implicit permissions.
        Non-admin named tokens and OIDC sessions require explicit assignments or verified claim mappings.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ name, role, via ]
                properties:
                  name: { type: string }
                  role: { type: string, enum: [ viewer, editor, admin, team, custom ] }
                  claimsFresh: { type: boolean, description: Whether fresh server-held claim data is available; raw claims are never returned. }
                  claimsExpire: { type: string, format: date-time, description: Deadline for mapping-derived permissions; direct subject and platform administrator rights have independent lifetimes. }
                  via: { type: string, enum: [ bootstrap-token, admin-token, oidc ] }
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/config:
    get:
      tags: [ System ]
      operationId: getAuthConfig
      summary: Whether browser sign-in (OIDC) is enabled
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ oidc ]
                properties:
                  oidc: { type: boolean }
  /auth/login:
    get:
      tags: [ System ]
      operationId: oidcLogin
      summary: Start OIDC sign-in (redirects to the identity provider)
      security: []
      responses:
        "302": { description: Redirect to the identity provider }
        "404": { description: OIDC is not configured }
  /auth/callback:
    get:
      tags: [ System ]
      operationId: oidcCallback
      summary: OIDC redirect target; sets the session cookie and redirects to the UI
      security: []
      responses:
        "302": { description: Signed in }
        "403": { description: The account is in no group mapped to a role }
  /auth/logout:
    post:
      tags: [ System ]
      operationId: oidcLogout
      summary: Clear the browser session
      security: []
      responses:
        "200":
          description: Signed out. The identity provider advertises RP-initiated logout; navigate the browser to `endSessionUrl` to end its session too.
          content:
            application/json:
              schema:
                type: object
                required: [ endSessionUrl ]
                properties:
                  endSessionUrl: { type: string, format: uri }
        "204": { description: Signed out (no provider-side logout available) }
  /api/v1/info:
    get:
      tags: [ System ]
      operationId: getInfo
      summary: Server version and current configuration revision
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/mock-provider:
    get:
      tags: [ Upstreams ]
      operationId: getMockProvider
      summary: Shared optional WireMock endpoint configured by the operator
      responses:
        "200":
          description: Integration configuration; no network call to WireMock
          content:
            application/json:
              schema:
                type: object
                required: [ enabled, url ]
                properties:
                  enabled: {type: boolean}
                  url: {type: string}
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/upstreams/{slug}/mock/status:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [ Upstreams ]
      operationId: getMockStatus
      summary: Compare saved mock definitions with scoped WireMock mappings
      responses:
        "200":
          description: Publication status; unavailable does not affect application readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/upstreams/{slug}/mock/sync:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      tags: [ Upstreams ]
      operationId: syncMockDefinitions
      summary: Admin-only reconciliation of saved mock definitions; never uses global WireMock reset
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: Publication status after reconciliation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "502":
          description: WireMock unavailable or rejected the definition
  /api/v1/upstreams:
    get:
      tags: [ Upstreams ]
      operationId: listUpstreams
      summary: List upstreams
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: enabled
          in: query
          schema: { type: boolean }
          description: Filter by enabled state.
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpstreamList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [ Upstreams ]
      operationId: createUpstream
      summary: Create an upstream (fails with 409 if the slug exists)
      description: |
        Creating an upstream does not contact it. Call `refresh-tools` afterwards (or use
        `connection-tests` first) to fetch its tool schemas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpstreamCreate"
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { schema: { type: string } }
            X-VMCP-Config-Revision: { $ref: "#/components/headers/ConfigRevision" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upstream"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
      parameters:
        - $ref: "#/components/parameters/CSRF"

  /api/v1/upstreams/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [ Upstreams ]
      operationId: getUpstream
      summary: Get an upstream
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "200":
          description: OK
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upstream"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [ Upstreams ]
      operationId: putUpstream
      summary: Create or replace an upstream (idempotent)
      description: |
        Full replacement of the writable fields. `headers` semantics: omitted keeps the stored
        headers; `{}` clears them; an object replaces them entirely.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpstreamInput"
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "200":
          description: Replaced
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-VMCP-Config-Revision: { $ref: "#/components/headers/ConfigRevision" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upstream"
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-VMCP-Config-Revision: { $ref: "#/components/headers/ConfigRevision" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upstream"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
    patch:
      tags: [ Upstreams ]
      operationId: patchUpstream
      summary: Partially update an upstream (JSON Merge Patch, RFC 7396)
      description: |
        Only the given fields change. Within `headers`, a `null` value deletes that single header,
        so one secret can be rotated without resending the others.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/UpstreamPatch"
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "200":
          description: Updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-VMCP-Config-Revision: { $ref: "#/components/headers/ConfigRevision" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Upstream"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [ Upstreams ]
      operationId: deleteUpstream
      summary: Delete an upstream
      description: |
        Fails with 409 `in_use` while virtual servers still select its tools, unless `force=true`,
        which also removes those selections.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - name: force
          in: query
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/CSRF"
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "204":
          description: Deleted
          headers:
            X-VMCP-Config-Revision: { $ref: "#/components/headers/ConfigRevision" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /api/v1/upstreams/{slug}/tools:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [ Upstreams ]
      operationId: listUpstreamTools
      summary: Cached tool schemas of an upstream
      description: Returns what the last `refresh-tools` fetched. It does not contact the upstream.
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ items ]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tool"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/upstreams/{slug}/refresh-tools:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      tags: [ Upstreams ]
      operationId: refreshUpstreamTools
      summary: Connect to the upstream and re-fetch its tool schemas
      description: |
        Safe to call repeatedly. Tools that disappeared upstream but are still selected by a
        virtual server are reported in `orphanedSelections`. They are kept in the configuration
        but not served until the tool reappears.
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "200":
          description: Refreshed
          headers:
            X-VMCP-Config-Revision: { $ref: "#/components/headers/ConfigRevision" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: The upstream could not be reached or answered with an error.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      parameters:
        - $ref: "#/components/parameters/CSRF"

  /api/v1/connection-tests:
    post:
      tags: [ Upstreams ]
      operationId: testConnection
      summary: Try connecting to an MCP server without saving anything
      description: Used by the UI before registering an upstream. Nothing is persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ url ]
              properties:
                url: { $ref: "#/components/schemas/UpstreamUrl" }
                transport: { $ref: "#/components/schemas/Transport" }
                headers: { $ref: "#/components/schemas/Headers" }
                tls: { $ref: "#/components/schemas/UpstreamTLSInput" }
                auth: { $ref: "#/components/schemas/UpstreamAuthInput" }
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "200":
          description: Outcome of the attempt (a failed connection is still a 200 with `ok=false`).
          content:
            application/json:
              schema:
                type: object
                required: [ ok ]
                properties:
                  ok: { type: boolean }
                  error: { type: string }
                  serverInfo:
                    type: object
                    properties:
                      name: { type: string }
                      version: { type: string }
                  protocolVersion: { type: string }
                  latencyMs: { type: integer }
                  tools:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tool"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Unprocessable"
      parameters:
        - $ref: "#/components/parameters/CSRF"

  /api/v1/virtual-servers:
    get:
      tags: [ Virtual Servers ]
      operationId: listVirtualServers
      summary: List virtual servers
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: enabled
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualServerList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [ Virtual Servers ]
      operationId: createVirtualServer
      summary: Create a virtual server (fails with 409 if the slug exists)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirtualServerCreate"
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { schema: { type: string } }
            X-VMCP-Config-Revision: { $ref: "#/components/headers/ConfigRevision" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualServer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Unprocessable"
      parameters:
        - $ref: "#/components/parameters/CSRF"

  /api/v1/virtual-servers/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [ Virtual Servers ]
      operationId: getVirtualServer
      summary: Get a virtual server
      responses:
        "200":
          description: OK
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualServer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [ Virtual Servers ]
      operationId: putVirtualServer
      summary: Create or replace a virtual server (idempotent)
      description: |
        The `tools` list is replaced atomically. Every selection must reference an existing upstream
        and a tool in its cached schema (`unknown_upstream`, `unknown_tool`), and exposed names
        must be unique (`duplicate_exposed_name`).
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirtualServerInput"
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "200":
          description: Replaced
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-VMCP-Config-Revision: { $ref: "#/components/headers/ConfigRevision" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualServer"
        "201":
          description: Created
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-VMCP-Config-Revision: { $ref: "#/components/headers/ConfigRevision" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualServer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
    patch:
      tags: [ Virtual Servers ]
      operationId: patchVirtualServer
      summary: Partially update a virtual server (JSON Merge Patch, RFC 7396)
      description: Merge-patch replaces arrays wholesale, so a patched `tools` list is the new list.
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/VirtualServerPatch"
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "200":
          description: Updated
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-VMCP-Config-Revision: { $ref: "#/components/headers/ConfigRevision" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualServer"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [ Virtual Servers ]
      operationId: deleteVirtualServer
      summary: Delete a virtual server
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "204":
          description: Deleted
          headers:
            X-VMCP-Config-Revision: { $ref: "#/components/headers/ConfigRevision" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /api/v1/agent-keys:
    get:
      tags: [ Agent Keys ]
      operationId: listAgentKeys
      summary: List agent keys (metadata only)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ items ]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AgentKey" }
                  nextCursor:
                    type: [ string, "null" ]
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [ Agent Keys ]
      operationId: createAgentKey
      summary: Create an agent key
      description: |
        The secret (`key`) is returned **only in this response**; only its hash is stored.
        Agents send it as `Authorization: Bearer <key>` to the data plane.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentKeyCreate"
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "201":
          description: Created
          headers:
            X-VMCP-Config-Revision: { $ref: "#/components/headers/ConfigRevision" }
            Cache-Control: { schema: { type: string, examples: [ no-store ] } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentKeyWithSecret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A key with this slug already exists.
        "422":
          $ref: "#/components/responses/Unprocessable"
      parameters:
        - $ref: "#/components/parameters/CSRF"

  /api/v1/agent-keys/{slug}:
    parameters:
      - $ref: "#/components/parameters/Slug"
    get:
      tags: [ Agent Keys ]
      operationId: getAgentKey
      summary: Get an agent key (never includes the secret)
      responses:
        "200":
          description: OK
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [ Agent Keys ]
      operationId: patchAgentKey
      summary: Update description, virtual servers, IP allowlist or expiry (JSON Merge Patch)
      description: '`expiresAt: null` clears the expiry. Arrays are replaced wholesale.'
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRF"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/AgentKeyPatch"
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "200":
          description: Updated
          headers:
            X-VMCP-Config-Revision: { $ref: "#/components/headers/ConfigRevision" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/Unprocessable"
    delete:
      tags: [ Agent Keys ]
      operationId: deleteAgentKey
      summary: Delete an agent key
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/CSRF"
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /api/v1/agent-keys/{slug}/rotate:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      tags: [ Agent Keys ]
      operationId: rotateAgentKey
      summary: Issue a new secret; the old one stops working immediately
      description: Also clears a previous revocation.
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "200":
          description: Rotated (new secret in `key`)
          headers:
            X-VMCP-Config-Revision: { $ref: "#/components/headers/ConfigRevision" }
            Cache-Control: { schema: { type: string, examples: [ no-store ] } }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentKeyWithSecret"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IfMatch"

  /api/v1/agent-keys/{slug}/revoke:
    parameters:
      - $ref: "#/components/parameters/Slug"
    post:
      tags: [ Agent Keys ]
      operationId: revokeAgentKey
      summary: Revoke a key (idempotent)
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "200":
          description: Revoked
          headers:
            X-VMCP-Config-Revision: { $ref: "#/components/headers/ConfigRevision" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
      parameters:
        - $ref: "#/components/parameters/CSRF"
        - $ref: "#/components/parameters/IfMatch"

  /api/v1/identity-bindings:
    get:
      tags: [ Identity Bindings ]
      operationId: listIdentityBindings
      summary: List identity bindings
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ items ]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/IdentityBinding" }
                  nextCursor:
                    type: [ string, "null" ]
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [ Identity Bindings ]
      operationId: createIdentityBinding
      summary: Create an identity binding
      description: |
        Maps claims of an IdP-issued JWT (see `VMCP_AGENT_OIDC_*`) to virtual servers. All
        conditions must match (AND). Access is denied unless a matching binding lists the virtual
        server and the client IP passes its allowlist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityBindingCreate"
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "201":
          description: Created
          headers:
            X-VMCP-Config-Revision: { $ref: "#/components/headers/ConfigRevision" }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityBinding"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: A binding with this slug already exists.
        "422":
          $ref: "#/components/responses/Unprocessable"
      parameters:
        - $ref: "#/components/parameters/CSRF"

  /api/v1/identity-bindings/evaluate:
    post:
      tags: [ Identity Bindings ]
      operationId: evaluateIdentityBindings
      summary: Dry-run which binding a set of claims would resolve to
      description: Nothing is authenticated or changed; use it to debug claim conditions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ claims ]
              properties:
                claims: { type: object, additionalProperties: true }
                virtualServer: { $ref: "#/components/schemas/Slug" }
                clientIp: { type: string }
      responses:
        "503":
          $ref: "#/components/responses/AuditUnavailable"
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  decision:
                    type: object
                    properties:
                      allowed: { type: boolean }
                      principal: { type: string, description: "`oauth:<slug>` when allowed." }
                      reason: { type: string }
                  matches:
                    type: array
                    items: { type: object, additionalProperties: true }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
