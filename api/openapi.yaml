      properties:
        kind:
          type: string
          enum:
            - tenant
            - team
            - project
            - upstream
            - virtual_server
        id:
          type: string
          format: uuid
    AuthorizationEvaluationInput:
      type: object
      additionalProperties: false
      required:
        - principal
        - permission
      properties:
        principal:
          type: object
          additionalProperties: false
          required:
            - kind
            - id
          properties:
            kind:
              type: string
              enum:
                - oidc
                - control_token
            issuer:
              type: string
            id:
              type: string
        claims:
          type: object
          additionalProperties: true
          description: Unverified OIDC samples only; not accepted for named token principals.
        permission:
          type: string
        resource:
          $ref: "#/components/schemas/AuthorizationEvaluationResource"
        auditEventId:
          type: string
          format: uuid
      oneOf:
        - required:
            - resource
          not:
            required:
              - auditEventId
        - required:
            - auditEventId
          not:
            required:
              - resource
    AuthorizationEvaluation:
      type: object
      required:
        - simulationOnly
        - authenticationValidated
        - authorizationRevision
        - claimMappings
        - matchedMappingIds
        - candidateAssignmentIds
        - decision
      properties:
        simulationOnly:
          type: boolean
          const: true
        authenticationValidated:
          type: boolean
          const: false
        authorizationRevision:
          type: integer
        claimMappings:
          type: string
          enum: [ simulation-only, live-audit ]
        matchedMappingIds:
          type: array
          items:
            type: string
            format: uuid
        candidateAssignmentIds:
          type: array
          items:
            type: string
            format: uuid
          description: Enabled direct or resolved assignments for the selected principal;
            candidates are not a grant of scope or permission.
        decision:
          type: object
          required:
            - allowed
            - reason
          properties:
            allowed:
              type: boolean
            reason:
              type: string
            assignmentId:
              type: string
              format: uuid
    AuthorizationStatus:
      type: object
      required:
        - authorizationRevision
        - schemaVersion
        - trustedIssuer
        - claimMappings
        - externalOAuthBearer
        - blockers
        - counts
      properties:
        authorizationRevision:
          type: integer
        schemaVersion:
          type: integer
        trustedIssuer:
          type: string
          description: Configured provider issuer, or empty when OIDC is absent.
        claimMappings:
          type: string
          enum: [ simulation-only, live-audit ]
        externalOAuthBearer:
          type: boolean
          const: false
        blockers:
          type: array
          items:
            type: string
        counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: roles, customRoles, assignments, enabledAssignments, mappings,
            enabledMappings, untrustedEnabledMappings,
            untrustedEnabledOIDCAssignments, inactiveTokenAssignments,
            unpinnedAuditResourceAssignments, legacyAuditEvents,
            resourceAuditEvents, tenantAuditEvents, legacyBrowserSessions,
            serverBrowserSessions, expiredBrowserSessions.
    AuthorizationAssignmentInput:
      type: object
      additionalProperties: false
      required:
        - roleId
        - scope
      description: Use exactly one principal or mappingId. Enabled defaults to false.
        Payload permissions require nonempty explicit captureScopes. UUIDs are
        immutable database IDs, not slugs. Disabled drafts still validate resource
        references.
      properties:
        roleId:
          type: string
          format: uuid
        principal:
          type: object
          additionalProperties: false
          required:
            - kind
            - id
          properties:
            kind:
              type: string
              enum:
                - control_token
                - oidc
            id:
              type: string
            issuer:
              type: string
        mappingId:
          type: string
          format: uuid
        scope:
          type: object
          additionalProperties: false
          required:
            - kind
          properties:
            kind:
              type: string
              enum:
                - tenant
                - unmanaged
                - team
                - project
                - upstream
                - virtual_server
            id:
              type: string
              format: uuid
            epoch:
              type: string
              format: uuid
            ownerTeam:
              type: string
              format: uuid
        captureScopes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - virtual
              - upstream
              - control
              - reads
              - system
              - omni
              - omni_diagnostics
              - omni_embedding
              - omni_rerank
        enabled:
          type: boolean
          default: false
      oneOf:
        - required:
            - principal
          not:
            required:
              - mappingId
        - required:
            - mappingId
          not:
            required:
              - principal
    AuthorizationAssignment:
      type: object
      required:
        - id
        - roleId
        - principal
        - scope
        - captureScopes
        - enabled
        - version
      properties:
        roleId:
          type: string
          format: uuid
        principal:
          type: object
          required:
            - kind
            - id
          properties:
            kind:
              type: string
            id:
              type: string
            issuer:
              type: string
        mappingId:
          type: string
          format: uuid
        scope:
          type: object
          additionalProperties: false
          required:
            - kind
          properties:
            kind:
              type: string
              enum:
                - tenant
                - unmanaged
                - team
                - project
                - upstream
                - virtual_server
            id:
              type: string
              format: uuid
            epoch:
              type: string
              format: uuid
            ownerTeam:
              type: string
              format: uuid
        captureScopes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - virtual
              - upstream
              - control
              - reads
              - system
              - omni
              - omni_diagnostics
              - omni_embedding
              - omni_rerank
        enabled:
          type: boolean
          default: false
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
    AuthorizationScopeOption:
      type: object
      required:
        - id
        - slug
        - name
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        ownerTeam:
          type: string
          format: uuid
        project:
          type: string
          format: uuid
        epoch:
          type: string
          format: uuid
    AuthorizationResourceEpoch:
      type: object
      required:
        - id
        - resourceId
        - kind
        - startRevision
        - endRevision
      properties:
        id:
          type: string
          format: uuid
        resourceId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - upstream
            - virtual_server
        ownerTeam:
          type: string
          format: uuid
        project:
          type: string
          format: uuid
        startRevision:
          type: integer
        endRevision:
          type:
            - integer
            - "null"
    AuthorizationPermission:
      type: object
      required:
        - id
        - scopes
        - captureRestricted
      properties:
        id:
          type: string
        scopes:
          type: array
          items:
            type: string
        captureRestricted:
          type: boolean
    AuthorizationRole:
      type: object
      required:
        - id
        - slug
        - name
        - description
        - builtin
        - version
        - permissions
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        builtin:
          type: boolean
        version:
          type: integer
          minimum: 1
        permissions:
          type: array
          items:
            type: string
    AuthorizationRoleInput:
      type: object
      additionalProperties: false
      required:
        - name
      description: POST requires slug and either explicit permissions (empty allowed)
        or copyFrom (source slug). PUT requires permissions, forbids copyFrom, and
        preserves slug.
      properties:
        slug:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 4000
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
        copyFrom:
          type: string
    Team:
      type: object
      additionalProperties: false
      required: [slug, name, issuer, group]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        issuer: { type: string }
        group: { type: string }
        canManage: { type: boolean, readOnly: true }
        version: { type: integer, default: 0 }
    Project:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        name: { type: string }
        ownerTeam: { type: string, default: "" }
        version: { type: integer, default: 0 }
    ToolGrant:
      type: object
      additionalProperties: false
      required: [virtualServer, upstream, tool, status]
      properties:
        virtualServer: { type: string }
        upstream: { type: string }
        tool: { type: string }
        status: { type: string, enum: [pending, approved, rejected, revoked] }
        reason: { type: string, maxLength: 2000 }
        actor: { type: string, readOnly: true }
        canDecide: { type: boolean, readOnly: true }
        consumerProject: { type: string, readOnly: true }
        consumerTeam: { type: string, readOnly: true }
        upstreamOwnerTeam: { type: string, readOnly: true }
        version: { type: integer, default: 0 }
    LocalAuditSettings:
      type: object
      additionalProperties: false
      required: [ revision, rules ]
      properties:
        revision: { type: integer }
        rules:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/AuditMaskRule' }
    AuditMaskRule:
      type: object
      additionalProperties: false
      required:
        - name
        - pattern
      properties:
        name:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,40}$
        pattern:
          type: string
          minLength: 1
          maxLength: 500
          description: Go RE2 expression; must not match empty strings. Matches are
            replaced with [REDACTED].
    AdmissionSettings:
      type: object
      additionalProperties: false
      required: [revision, total, perServer, perPrincipal]
      properties:
        revision: { type: integer, format: int64, minimum: 1 }
        total: { type: integer, minimum: 1, maximum: 65536, default: 1024 }
        perServer: { type: integer, minimum: 1, maximum: 65536, default: 128 }
        perPrincipal: { type: integer, minimum: 1, maximum: 65536, default: 16 }
    AuditSettings:
      type: object
      additionalProperties: false
      required:
        - mode
        - retentionDays
        - maxPayloadBytes
        - scopes
        - rules
        - virtualServers
        - upstreams
        - revision
      properties:
        mode:
          type: string
          enum:
            - ""
            - strict
            - relax
        retentionDays:
          type: integer
          minimum: 1
          maximum: 3650
          default: 7
        maxPayloadBytes:
          type: integer
          minimum: 256
          maximum: 1048576
          default: 65536
        revision:
          type: integer
          minimum: 0
        omni:
          type: object
          additionalProperties: false
          properties:
            candidates: { type: boolean, default: false }
            includeDenied: { type: boolean, default: false }
            maxCandidates: { type: integer, minimum: 0, maximum: 200, default: 100 }
        scopes:
          type: object
          additionalProperties: false
          properties:
            virtual:
              type: object
              additionalProperties: false
              required:
                - request
                - response
              properties:
                request:
                  type: boolean
                response:
                  type: boolean
            upstream:
              type: object
              additionalProperties: false
              required:
                - request
                - response
              properties:
                request:
                  type: boolean
                response:
                  type: boolean
            control:
              type: object
              additionalProperties: false
              required:
                - request
                - response
              properties:
                request:
                  type: boolean
                response:
                  type: boolean
            system:
              type: object
              additionalProperties: false
              required:
                - request
                - response
              properties:
                request:
                  type: boolean
                response:
                  type: boolean
            reads:
              type: object
              additionalProperties: false
              required:
                - request
                - response
              properties:
                request:
                  type: boolean
                response:
                  type: boolean
            omni:
              type: object
              additionalProperties: false
              required: [request, response]
              properties:
                request: { type: boolean }
                response: { type: boolean }
            omni_diagnostics:
              type: object
              additionalProperties: false
              required: [request, response]
              properties:
                request: { type: boolean }
                response: { type: boolean }
            omni_embedding:
              type: object
              additionalProperties: false
              required: [request, response]
              properties:
                request: { type: boolean }
                response: { type: boolean }
            omni_rerank:
              type: object
              additionalProperties: false
              required: [request, response]
              properties:
                request: { type: boolean }
                response: { type: boolean }
        rules: &a1
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/AuditMaskRule"
        virtualServers:
          type: object
          additionalProperties: *a1
        upstreams:
          type: object
          additionalProperties: *a1
        exportPayloads:
          type: object
          additionalProperties:
            type: boolean
          description: Consumer name to payload export authorization. Default is metadata only.
    AuditPreviewInput:
      type: object
      additionalProperties: false
      required:
        - settings
        - scope
        - direction
        - payload
      properties:
        editScope:
          type: string
          enum: [ global, virtual, upstream ]
          description: Local previews merge only the edited local rules into current saved settings; stale revisions return 409.
        settings:
          $ref: "#/components/schemas/AuditSettings"
        scope:
          type: string
          enum:
            - virtual
            - upstream
            - control
            - system
            - reads
            - omni
            - omni_diagnostics
            - omni_embedding
            - omni_rerank
        direction:
          type: string
          enum:
            - request
            - response
        virtualServer:
          type: string
        upstream:
          type: string
        payload: {}
    AuditPreview:
      type: object
      properties:
        state:
          type: string
        content: {}
        originalBytes:
          type: integer
        storedBytes:
          type: integer
        redactions:
          type: integer
        revision:
          type: integer
        matches:
          type: array
          items:
            type: object
            properties:
              source:
                type: string
              name:
                type: string
              count:
                type: integer
    AuditPayload:
      type: object
      required:
        - state
      properties:
        state:
          type: string
        content: {}
    Slug:
      type: string
      minLength: 1
      maxLength: 63
      pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
      description: Lowercase letters, digits and hyphens. Immutable once created.
      examples: [ github, support-agent ]

    Transport:
      type: string
      enum: [ streamable_http, sse ]
      default: streamable_http
      description: '`sse` is the legacy HTTP+SSE transport.'

    UpstreamUrl:
      type: string
      format: uri
      pattern: "^https?://"
      examples: [ "https://mcp.example.com/mcp" ]

    Headers:
      type: object
      additionalProperties: { type: string }
      writeOnly: true
      description: |
        Headers sent to the upstream on every request (typically `Authorization`). Encrypted at
        rest and never returned.
      examples:
        - Authorization: Bearer s3cret

    ToolName:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9_.-]+$"

    # ---- Upstreams ----
    UpstreamInput:
      type: object
      required: [ name, url ]
      additionalProperties: false
      properties:
        ownerTeam: { type: string, description: "Owner team slug; empty means Default. Omission preserves existing ownership. Transfers require platform admin." }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000, default: "" }
        url: { $ref: "#/components/schemas/UpstreamUrl" }
        fallbackUrls:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/UpstreamUrl" }
          description: |
            Further URLs of the same upstream, tried in order when `url` does not answer. Tool
            discovery, connection tests of stored upstreams and agent sessions all fall through them.
        transport: { $ref: "#/components/schemas/Transport" }
        enabled: { type: boolean, default: true }
        headers: { $ref: "#/components/schemas/Headers" }
        tls: { $ref: "#/components/schemas/UpstreamTLSInput" }
        auth: { $ref: "#/components/schemas/UpstreamAuthInput" }
        kind:
          type: string
          enum:
            - mcp
            - rest
          description: Immutable upstream kind. Defaults to mcp on create; omission preserves existing kind on update.
        requestHeaderMappings:
          type: array
          maxItems: 16
          description: Per-tool-call HTTP header mappings. Omit to preserve; an empty array clears.
          items:
            $ref: "#/components/schemas/RequestHeaderMapping"
        callerContext:
          $ref: "#/components/schemas/CallerContextConfig"
        rest:
          $ref: "#/components/schemas/RESTConfig"

    UpstreamCreate:
      type: object
      properties:
        ownerTeam: { type: string, description: "Owner team slug; empty means Default. Omission preserves existing ownership. Transfers require platform admin." }
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
          default: ""
        url:
          $ref: "#/components/schemas/UpstreamUrl"
        fallbackUrls:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/UpstreamUrl"
          description: |
            Further URLs of the same upstream, tried in order when `url` does not answer. Tool
            discovery, connection tests of stored upstreams and agent sessions all fall through them.
        transport:
          $ref: "#/components/schemas/Transport"
        enabled:
          type: boolean
          default: true
        headers:
          $ref: "#/components/schemas/Headers"
        tls:
          $ref: "#/components/schemas/UpstreamTLSInput"
        auth:
          $ref: "#/components/schemas/UpstreamAuthInput"
        slug:
          $ref: "#/components/schemas/Slug"
        kind:
          type: string
          enum:
            - mcp
            - rest
          description: Immutable upstream kind. Defaults to mcp on create; omission preserves existing kind on update.
        requestHeaderMappings:
          type: array
          maxItems: 16
          description: Per-tool-call HTTP header mappings. Omit to preserve; an empty array clears.
          items:
            $ref: "#/components/schemas/RequestHeaderMapping"
        callerContext:
          $ref: "#/components/schemas/CallerContextConfig"
        rest:
          $ref: "#/components/schemas/RESTConfig"
      required:
        - name
        - url
        - slug
      additionalProperties: false

    UpstreamPatch:
      type: object
      additionalProperties: false
      description: Any subset of the writable fields. `headers` values may be `null` to delete one header.
      properties:
        ownerTeam: { type: string, description: "Owner team slug; empty means Default. Omission preserves existing ownership. Transfers require platform admin." }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        url: { $ref: "#/components/schemas/UpstreamUrl" }
        fallbackUrls:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/UpstreamUrl" }
          description: |
            Further URLs of the same upstream, tried in order when `url` does not answer. Tool
            discovery, connection tests of stored upstreams and agent sessions all fall through them.
        transport: { $ref: "#/components/schemas/Transport" }
        enabled: { type: boolean }
        headers:
          type: object
          additionalProperties:
            type: [ string, "null" ]
        tls:
          type: object
          additionalProperties: false
          description: Merge patch of the TLS settings; omitted fields stay, an empty string clears a field (clearing `clientCertPem` also clears the key).
          properties:
            caPem: { type: string }
            serverName: { type: string }
            clientCertPem: { type: string }
            clientKeyPem: { type: string, writeOnly: true }
        auth: { $ref: "#/components/schemas/UpstreamAuthPatch" }
        kind:
          type: string
          enum:
            - mcp
            - rest
          description: Immutable upstream kind. Defaults to mcp on create; omission preserves existing kind on update.
        requestHeaderMappings:
          type: array
          maxItems: 16
          description: Per-tool-call HTTP header mappings. Omit to preserve; an empty array clears.
          items:
            $ref: "#/components/schemas/RequestHeaderMapping"
        callerContext:
          $ref: "#/components/schemas/CallerContextConfig"
        rest:
          $ref: "#/components/schemas/RESTConfig"

    UpstreamTLSInput:
      type: object
      additionalProperties: false
      description: |
        Per-upstream TLS. `caPem` (a CA, or the self-signed certificate itself) becomes the **only**
        trusted root for this upstream and is applied to tool discovery, health checks, connection
        tests and agent sessions. There is intentionally no way to disable verification.
        On writes the whole block replaces the stored settings; omit the block to keep them.
        An omitted `clientKeyPem` keeps the stored key.
      properties:
        caPem:
          type: string
          maxLength: 65536
          description: PEM bundle of up to 10 certificates.
        serverName:
          type: string
          description: Host name used for SNI and certificate verification (needed when reaching the server by IP or an alias).
        clientCertPem:
          type: string
          maxLength: 65536
          description: Client certificate for mutual TLS.
        clientKeyPem:
          type: string
          writeOnly: true
          description: Private key of `clientCertPem`. Encrypted at rest, never returned or exported.

    UpstreamTLS:
      type: object
      required: [ caPem, serverName, clientCertPem, hasClientKey, caCerts ]
      properties:
        caPem: { type: string }
        serverName: { type: string }
        clientCertPem: { type: string }
        hasClientKey: { type: boolean }
        caCerts:
          type: array
          items: { $ref: "#/components/schemas/CertInfo" }
        clientCert:
          oneOf:
            - $ref: "#/components/schemas/CertInfo"
            - type: "null"

    UpstreamAuthInput:
      type: object
      required: [ type ]
      additionalProperties: false
      description: |
        Gateway-to-upstream authentication. Supports `oauth_client_credentials` where the gateway
        fetches and caches tokens from an OAuth 2.0 token endpoint. Setting type to `none` removes
        configured OAuth settings. Cannot be combined with a static `Authorization` header.
      properties:
        type:
          type: string
          enum: [ none, oauth_client_credentials ]
        tokenUrl:
          type: string
          description: OAuth 2.0 token endpoint URL.
        clientId:
          type: string
        clientSecret:
          type: string
          writeOnly: true
          description: Client secret, encrypted at rest and never exported or returned.
        scopes:
          type: array
          items: { type: string }
        audience:
          type: string
          description: Optional audience parameter sent to the token endpoint.

    UpstreamAuthPatch:
      type: object
      additionalProperties: false
      description: JSON merge patch for upstream OAuth settings. Setting type to `none` removes it.
      properties:
        type:
          type: string
          enum: [ none, oauth_client_credentials ]
        tokenUrl:
          type: string
        clientId:
          type: string
        clientSecret:
          type: string
          writeOnly: true
        scopes:
          type: array
          items: { type: string }
        audience:
          type: string

    UpstreamAuth:
      type: object
      required: [ type ]
      properties:
        type:
          type: string
          enum: [ none, oauth_client_credentials ]
        tokenUrl:
          type: string
        clientId:
          type: string
        scopes:
          type: array
          items: { type: string }
        audience:
          type: string
        hasClientSecret:
          type: boolean

    CertInfo:
      type: object
      required: [ subject, notAfter ]
      properties:
        subject: { type: string }
        notAfter: { type: string, format: date-time }

    Upstream:
      type: object
      required:
        - slug
        - name
        - url
        - transport
        - enabled
        - headerNames
        - toolCount
        - createdAt
        - updatedAt
      properties:
        ownerTeam: { type: string, description: "Owner team slug; empty means Default. Omission preserves existing ownership. Transfers require platform admin." }
        slug:
          $ref: "#/components/schemas/Slug"
        name:
          type: string
        description:
          type: string
        url:
          $ref: "#/components/schemas/UpstreamUrl"
        fallbackUrls:
          type: array
          items:
            $ref: "#/components/schemas/UpstreamUrl"
        transport:
          $ref: "#/components/schemas/Transport"
        enabled:
          type: boolean
        health:
          $ref: "#/components/schemas/UpstreamHealth"
        tls:
          $ref: "#/components/schemas/UpstreamTLS"
        auth:
          $ref: "#/components/schemas/UpstreamAuth"
        headerNames:
          type: array
          items:
            type: string
          description: Names (never values) of the configured headers.
        toolCount:
          type: integer
          description: Number of cached tools.
        lastRefreshAt:
          type:
            - string
            - "null"
          format: date-time
        lastRefreshError:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
          readOnly: true
        kind:
          type: string
          enum:
            - mcp
            - rest
          description: Immutable upstream kind. Defaults to mcp on create; omission preserves existing kind on update.
        requestHeaderMappings:
          type: array
          maxItems: 16
          description: Per-tool-call HTTP header mappings. Omit to preserve; an empty array clears.
          items:
            $ref: "#/components/schemas/RequestHeaderMapping"
        callerContext:
          $ref: "#/components/schemas/CallerContextConfig"
        rest:
          $ref: "#/components/schemas/RESTConfig"

    UpstreamHealth:
      type: object
      required: [ state, nodes ]
      description: |
        What the data-plane nodes saw when they last probed this upstream (every 30 s by default;
        probes older than 2 minutes are ignored, so a dead node drops out).
      properties:
        state:
          type: string
          enum: [ unknown, healthy, degraded, unhealthy ]
          description: "`degraded` means the nodes disagree."
        nodes:
          type: array
          items:
            type: object
            required: [ node, state, breaker, checkedAt ]
            properties:
              node: { type: string }
              state: { type: string, enum: [ healthy, unhealthy ] }
              breaker: { type: string, enum: [ closed, open, half_open ], description: "Circuit breaker of this node for the upstream." }
              url: { type: string, description: "The URL that answered, or the last one tried." }
              latencyMs: { type: integer }
              error: { type: [ string, "null" ] }
              checkedAt: { type: string, format: date-time }

    UpstreamList:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Upstream" }
        nextCursor:
          type: [ string, "null" ]

    Tool:
      type: object
      required: [ name, inputSchema ]
      properties:
        name: { type: string }
        description: { type: string }
        inputSchema:
          type: object
          description: JSON Schema, passed through untouched.
          additionalProperties: true
        annotations:
          type: object
          additionalProperties: true
        fetchedAt: { type: string, format: date-time }
        title:
          type: string
        outputSchema:
          type: object
        _meta:
          type: object
      additionalProperties: true

    RefreshResult:
      type: object
      required: [ toolCount, added, removed, changed, orphanedSelections, fetchedAt ]
      properties:
        toolCount: { type: integer }
        added: { type: array, items: { type: string } }
        removed: { type: array, items: { type: string } }
        changed:
          type: array
          items: { type: string }
          description: Tools whose description or schema changed.
        orphanedSelections:
          type: array
          description: Virtual-server selections pointing at tools that no longer exist.
          items:
            type: object
            required: [ virtualServer, tool ]
            properties:
              virtualServer: { $ref: "#/components/schemas/Slug" }
              tool: { type: string }
        fetchedAt: { type: string, format: date-time }

    # ---- Virtual servers ----
    ToolSelection:
      type: object
      required: [ upstream, tool ]
      additionalProperties: false
      properties:
        upstream:
          $ref: "#/components/schemas/Slug"
        tool:
          type: string
          description: Tool name as exposed by the upstream.
        alias:
          $ref: "#/components/schemas/ToolName"
        description:
          type: string
          maxLength: 20000
          description: |
            Replaces the upstream description in `tools/list` of this virtual server only. Empty or
            omitted uses the upstream text. Saving an unchanged selection acknowledges drift.

    ResolvedToolSelection:
      type: object
      properties:
        upstream:
          $ref: "#/components/schemas/Slug"
        tool:
          type: string
          description: Tool name as exposed by the upstream.
        alias:
          $ref: "#/components/schemas/ToolName"
        description:
          type: string
          maxLength: 20000
          description: |
            Replaces the upstream description in `tools/list` of this virtual server only. Empty or
            omitted uses the upstream text. Saving an unchanged selection acknowledges drift.
        upstreamDescription:
          type: string
          readOnly: true
          description: Current description of the upstream tool.
        descriptionDrift:
          type: boolean
          readOnly: true
          description: True when an override exists and the upstream description changed since it was written.
        exposedName:
          type: string
          readOnly: true
          description: Name agents see. `alias` if set, else `{upstream}__{tool}`.
        orphaned:
          type: boolean
          readOnly: true
          description: The selection is retained but its upstream tool is no longer discovered.
      required:
        - upstream
        - tool
        - exposedName
        - upstreamDescription
        - descriptionDrift
      additionalProperties: false

    VirtualServerInput:
      type: object
      required: [ name ]
      additionalProperties: false
      properties:
        omniEnabled: { type: boolean, description: "Publish through Omni MCP. Defaults to false on create; omission preserves existing publication. Runtime permissions still apply." }
        project: { type: string, description: "Project slug; default on create. Omission preserves existing project. Transfers require platform admin." }
        guidance:
          $ref: "#/components/schemas/Guidance"
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000, default: "" }
        enabled: { type: boolean, default: true }
        authRequired:
          type: boolean
          default: true
          description: When true, agents must present an agent key assigned to this virtual server.
        pii: { $ref: "#/components/schemas/PiiConfig" }
        policy: { $ref: "#/components/schemas/ToolPolicy" }
        rateLimitPerMinute: { type: [ integer, "null" ], minimum: 1, maximum: 1000000, description: "Calls per minute allowed; null means no limit. Excess calls get HTTP 429 with Retry-After." }
        tools:
          type: array
          default: []
          items: { $ref: "#/components/schemas/ToolSelection" }
        catalog:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/CatalogSelection"
        clientFeatures:
          $ref: "#/components/schemas/ClientFeatures"

    VirtualServerCreate:
      type: object
      properties:
        omniEnabled: { type: boolean, description: "Publish through Omni MCP. Defaults to false on create; omission preserves existing publication. Runtime permissions still apply." }
        project: { type: string, description: "Project slug; default on create. Omission preserves existing project. Transfers require platform admin." }
        guidance:
          $ref: "#/components/schemas/Guidance"
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 1000
          default: ""
        enabled:
          type: boolean
          default: true
        authRequired:
          type: boolean
          default: true
          description: When true, agents must present an agent key assigned to this virtual server.
        pii:
          $ref: "#/components/schemas/PiiConfig"
        policy:
          $ref: "#/components/schemas/ToolPolicy"
        rateLimitPerMinute:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 1000000
          description: Calls per minute allowed; null means no limit. Excess calls get HTTP 429 with Retry-After.
        tools:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/ToolSelection"
        slug:
          $ref: "#/components/schemas/Slug"
        catalog:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/CatalogSelection"
        clientFeatures:
          $ref: "#/components/schemas/ClientFeatures"
      required:
        - name
        - slug
      additionalProperties: false

    VirtualServerPatch:
      type: object
      additionalProperties: false
      properties:
        omniEnabled: { type: boolean, description: "Publish through Omni MCP. Defaults to false on create; omission preserves existing publication. Runtime permissions still apply." }
        project: { type: string, description: "Project slug; default on create. Omission preserves existing project. Transfers require platform admin." }
        guidance:
          $ref: "#/components/schemas/GuidancePatch"
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        enabled: { type: boolean }
        authRequired: { type: boolean }
        pii: { $ref: "#/components/schemas/PiiConfig" }
        policy: { $ref: "#/components/schemas/ToolPolicy" }
        rateLimitPerMinute: { type: [ integer, "null" ], minimum: 1, maximum: 1000000, description: "Calls per minute allowed; null means no limit. Excess calls get HTTP 429 with Retry-After." }
        tools:
          type: array
          items: { $ref: "#/components/schemas/ToolSelection" }
        catalog:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/CatalogSelection"
        clientFeatures:
          $ref: "#/components/schemas/ClientFeatures"

    VirtualServer:
      type: object
      required:
        - slug
        - name
        - enabled
        - authRequired
        - endpoint
        - tools
        - createdAt
        - updatedAt
      properties:
        omniEnabled: { type: boolean, description: "Publish through Omni MCP. Defaults to false on create; omission preserves existing publication. Runtime permissions still apply." }
        project: { type: string, description: "Project slug; default on create. Omission preserves existing project. Transfers require platform admin." }
        hasGuidance: { type: boolean, readOnly: true, description: "Whether authored guidance exists. Full guidance is returned by the individual GET; omitted from inventory lists." }
        guidance:
          $ref: "#/components/schemas/Guidance"
        slug:
          $ref: "#/components/schemas/Slug"
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        authRequired:
          type: boolean
        pii:
          $ref: "#/components/schemas/PiiConfig"
        policy:
          $ref: "#/components/schemas/ToolPolicy"
        rateLimitPerMinute:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 1000000
          description: Calls per minute allowed; null means no limit. Excess calls get HTTP 429 with Retry-After.
        endpoint:
          type: string
          description: Path agents connect to on the data plane.
          examples:
            - /mcp/v1/virtual/support-agent
        tools:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedToolSelection"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
          readOnly: true
        catalog:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/ResolvedCatalogSelection"
        clientFeatures:
          $ref: "#/components/schemas/ClientFeatures"

    VirtualServerList:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/VirtualServer" }
        nextCursor:
          type: [ string, "null" ]
        clientFeatures:
          $ref: "#/components/schemas/ClientFeatures"

    AuditCorrelation:
      type: object
      additionalProperties: false
      description: Optional JSON Pointers relative to params._meta. Empty object disables extraction; omission on PATCH preserves configuration. Caller-supplied IDs do not grant access. Invalid/missing runtime values never reject calls.
      properties:
        conversationId: { type: string, maxLength: 512 }
        rootConversationId: { type: string, maxLength: 512 }
        turnId: { type: string, maxLength: 512 }

    AuditConversation:
      type: object
      required: [ conversationGroupId, rootConversationId, firstTime, lastTime, lastId, records, operations, errors, conversations ]
      properties:
        conversationGroupId: { type: string }
        rootConversationId: { type: string }
        actorId: { type: string }
        firstTime: { type: string, format: date-time }
        lastTime: { type: string, format: date-time }
        lastId: { type: integer, format: int64 }
        records: { type: integer, description: Authorized records matching the active filters. }
        operations: { type: integer, description: Distinct root operations, excluding linked children. }
        errors: { type: integer, description: Root outcomes with error, tool_error or denied status. }
        conversations: { type: integer }

    AgentKey:
      type: object
      required:
        - slug
        - description
        - keyPrefix
        - virtualServers
        - ipAllowlist
        - status
        - createdAt
        - updatedAt
      properties:
        auditCorrelation: { $ref: "#/components/schemas/AuditCorrelation" }
        slug:
          $ref: "#/components/schemas/Slug"
        description:
          type: string
        keyPrefix:
          type: string
          description: First characters of the key, to identify it in UIs and logs.
        virtualServers:
          type: array
          items:
            $ref: "#/components/schemas/Slug"
        ipAllowlist:
          type: array
          description: Allowed client addresses as CIDRs. Empty means any address.
          items:
            type: string
            examples:
              - 10.0.0.0/8
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        rateLimitPerMinute:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 1000000
          description: Calls per minute allowed; null means no limit. Excess calls get HTTP 429 with Retry-After.
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
        status:
          type: string
          enum:
            - active
            - expired
            - revoked
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
          readOnly: true

    AgentKeyWithSecret:
      type: object
      properties:
        slug:
          $ref: "#/components/schemas/Slug"
        description:
          type: string
        keyPrefix:
          type: string
          description: First characters of the key, to identify it in UIs and logs.
        virtualServers:
          type: array
          items:
            $ref: "#/components/schemas/Slug"
        ipAllowlist:
          type: array
          description: Allowed client addresses as CIDRs. Empty means any address.
          items:
            type: string
            examples:
              - 10.0.0.0/8
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        rateLimitPerMinute:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 1000000
          description: Calls per minute allowed; null means no limit. Excess calls get HTTP 429 with Retry-After.
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
        status:
          type: string
          enum:
            - active
            - expired
            - revoked
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        key:
          type: string
          description: The secret. Shown once; store it now.
        version:
          type: integer
          minimum: 1
          readOnly: true
      required:
        - slug
        - description
        - keyPrefix
        - virtualServers
        - ipAllowlist
        - status
        - createdAt
        - updatedAt
        - key
      additionalProperties: false

    AgentKeyCreate:
      type: object
      required: [ slug ]
      additionalProperties: false
      properties:
        auditCorrelation: { $ref: "#/components/schemas/AuditCorrelation" }
        slug: { $ref: "#/components/schemas/Slug" }
        description: { type: string, maxLength: 1000 }
        virtualServers:
          type: array
          items: { $ref: "#/components/schemas/Slug" }
        ipAllowlist:
          type: array
          description: Addresses or CIDRs; bare addresses are normalized to /32 or /128.
          items: { type: string }
        expiresAt: { type: [ string, "null" ], format: date-time, description: Must be in the future. }
        rateLimitPerMinute: { type: [ integer, "null" ], minimum: 1, maximum: 1000000, description: "Calls per minute allowed; null means no limit. Excess calls get HTTP 429 with Retry-After." }

    AgentKeyPatch:
      type: object
      additionalProperties: false
      properties:
        auditCorrelation: { $ref: "#/components/schemas/AuditCorrelation" }
        description: { type: string, maxLength: 1000 }
        virtualServers:
          type: array
          items: { $ref: "#/components/schemas/Slug" }
        ipAllowlist:
          type: array
          items: { type: string }
        expiresAt: { type: [ string, "null" ], format: date-time }
        rateLimitPerMinute: { type: [ integer, "null" ], minimum: 1, maximum: 1000000, description: "Calls per minute allowed; null means no limit. Excess calls get HTTP 429 with Retry-After." }

    Condition:
      type: object
      required: [ claim, op ]
      additionalProperties: false
      properties:
        claim: { type: string, description: "Claim name or dotted path, e.g. `azp` or `realm_access.roles`." }
        op: { type: string, enum: [ equals, contains, exists ] }
        value: { type: string }

    IdentityBindingCreate:
      type: object
      required: [ slug, conditions, virtualServers ]
      additionalProperties: false
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        description: { type: string, maxLength: 1000 }
        conditions:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/Condition" }
        virtualServers:
          type: array
          items: { $ref: "#/components/schemas/Slug" }
        ipAllowlist:
          type: array
          items: { type: string, description: IP or CIDR. }
        rateLimitPerMinute: { type: [ integer, "null" ], minimum: 1, maximum: 1000000 }
        enabled: { type: boolean, default: true }

    IdentityBinding:
      type: object
      properties:
        slug:
          $ref: "#/components/schemas/Slug"
        description:
          type: string
          maxLength: 1000
        conditions:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/Condition"
        virtualServers:
          type: array
          items:
            $ref: "#/components/schemas/Slug"
        ipAllowlist:
          type: array
          items:
            type: string
            description: IP or CIDR.
        rateLimitPerMinute:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 1000000
        enabled:
          type: boolean
          default: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
          readOnly: true
      required:
        - slug
        - conditions
        - virtualServers
      additionalProperties: false

    IdentityBindingPatch:
      type: object
      additionalProperties: false
      properties:
        description: { type: string, maxLength: 1000 }
        conditions:
          type: array
          items: { $ref: "#/components/schemas/Condition" }
        virtualServers:
          type: array
          items: { $ref: "#/components/schemas/Slug" }
        ipAllowlist:
          type: array
          items: { type: string }
        rateLimitPerMinute: { type: [ integer, "null" ], minimum: 1, maximum: 1000000 }
        enabled: { type: boolean }

    ToolPolicy:
      type: object
      additionalProperties: false
      description: |
        Which of the virtual server's tools agents may see and call. Blocked tools are hidden from
        `tools/list`, calls to them are refused and audited as `denied`. `read_only` passes only tools
        whose upstream declares `readOnlyHint: true`; tools without annotations are blocked.
      properties:
        default:
          type: string
          enum: [ allow, deny, read_only ]
          default: allow
        tools:
          type:
            - object
            - "null"
          description: Per-tool override, keyed by exposed tool name.
          additionalProperties:
            type: string
            enum: [ allow, deny, read_only ]

    PiiConfig:
      type: object
      description: |
        Masks personal data in tool results (and optionally arguments) before they leave the
        gateway. Matches become `[REDACTED:<TYPE>]`. Built-in detectors with checksum validation:
        `iban`, `credit_card`, `tckn`, `us_ssn`; pattern-based: `email`, `phone`.
        Custom rules use RE2 syntax (no backtracking).
      additionalProperties: false
      properties:
        enabled: { type: boolean, default: false }
        detectors:
          type: array
          description: Built-in detectors to apply. Empty means all of them.
          items: { type: string, enum: [ iban, credit_card, tckn, us_ssn, email, phone ] }
        customRules:
          type: array
          maxItems: 20
          items:
            type: object
            required: [ name, pattern ]
            additionalProperties: false
            properties:
              name: { type: string, pattern: "^[A-Za-z0-9_-]{1,40}$" }
              pattern: { type: string, maxLength: 500, description: RE2 regular expression; must not match the empty string. }
        maskArguments:
          type: boolean
          default: false
          description: Also mask tool arguments before they reach the upstream.

    AdminToken:
      type: object
      required:
        - slug
        - description
        - scope
        - tokenPrefix
        - status
        - createdAt
        - updatedAt
      properties:
        slug:
          $ref: "#/components/schemas/Slug"
        description:
          type: string
        scope:
          type: string
          enum:
            - admin
            - read
        tokenPrefix:
          type: string
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
        lastUsedAt:
          type:
            - string
            - "null"
          format: date-time
          description: Refreshed at most once a minute.
        status:
          type: string
          enum:
            - active
            - expired
            - revoked
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
          readOnly: true

    AdminTokenWithSecret:
      type: object
      properties:
        slug:
          $ref: "#/components/schemas/Slug"
        description:
          type: string
        scope:
          type: string
          enum:
            - admin
            - read
        tokenPrefix:
          type: string
        expiresAt:
          type:
            - string
            - "null"
          format: date-time
        revokedAt:
          type:
            - string
            - "null"
          format: date-time
        lastUsedAt:
          type:
            - string
            - "null"
          format: date-time
          description: Refreshed at most once a minute.
        status:
          type: string
          enum:
            - active
            - expired
            - revoked
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        token:
          type: string
          description: The secret. Shown once; store it now.
        version:
          type: integer
          minimum: 1
          readOnly: true
      required:
        - slug
        - description
        - scope
        - tokenPrefix
        - status
        - createdAt
        - updatedAt
        - token
      additionalProperties: false

    AdminTokenCreate:
      type: object
      required: [ slug ]
      additionalProperties: false
      properties:
        slug: { $ref: "#/components/schemas/Slug" }
        description: { type: string, maxLength: 1000 }
        scope: { type: string, enum: [ admin, read ], default: read, description: Non-admin read tokens use explicit permission assignments; the scope label grants no implicit GET access. }
        expiresAt: { type: [ string, "null" ], format: date-time, description: Must be in the future. }

    AdminTokenPatch:
      type: object
      additionalProperties: false
      properties:
        description: { type: string, maxLength: 1000 }
        scope: { type: string, enum: [ admin, read ] }
        expiresAt: { type: [ string, "null" ], format: date-time }

    AuditStatus:
      type: object
      required: [ process, durable ]
      properties:
        process:
          type: object
          properties:
            mode: { type: string, enum: [ strict, best_effort ] }
            blockedAdmissions: { type: integer, format: int64 }
            failedWrites: { type: integer, format: int64 }
            deadLetters: { type: integer, format: int64, description: Process-local permanent write rejections; no durable dead-letter queue is implied. }
            dropped: { type: integer, format: int64 }
            pending: { type: integer, format: int64 }
            oldestPendingAgeSeconds: { type: number }
        durable:
          type: object
          properties:
            incomplete: { type: integer, format: int64 }
            oldestIncompleteAgeSeconds: { type: number }

    AuditCapabilities:
      type: object
      required: [ canReadMetadata, canReadIdentities, canReadDetails, canReadPayload, canReadRequestPayload, canReadResponsePayload, authorizationRevision ]
      properties:
        canReadMetadata: { type: boolean }
        canReadIdentities: { type: boolean }
        canReadDetails: { type: boolean }
        canReadPayload: { type: boolean }
        canReadRequestPayload: { type: boolean }
        canReadResponsePayload: { type: boolean }
        authorizationRevision: { type: integer, format: int64 }
    AuditEvent:
      type: object
      required: [ tenantId, id, eventId, schemaVersion, stage, time, virtualServer, method, status, durationMs ]
      properties:
        capabilities: { $ref: "#/components/schemas/AuditCapabilities" }
        conversationId: { type: string, maxLength: 256 }
        rootConversationId: { type: string, maxLength: 256 }
        turnId: { type: string, maxLength: 256 }
        conversationGroupId: { type: string, description: Credential-scoped root conversation digest; not a credential. }
        correlationStatus: { type: string, enum: [ captured, missing, invalid ] }
        auditMode:
          type: string
          enum:
            - strict
            - relax
            - legacy
        policyRevision:
          type: integer
        scope:
          type: string
        boundary:
          type: string
        direction:
          type: string
        parentOperationId:
          type:
            - string
            - "null"
          format: uuid
        payloadState:
          type: string
        payloadOriginalBytes:
          type: integer
        payloadStoredBytes:
          type: integer
        payloadRedactions:
          type: integer
        tenantId: { type: string }
        eventId: { type: string, format: uuid }
        operationId: { type: [ string, "null" ], format: uuid }
        requestId: { type: [ string, "null" ], format: uuid }
        traceId: { type: string }
        schemaVersion: { type: integer }
        actorType: { type: string }
        actorId: { type: string }
        issuer: { type: string }
        action: { type: string }
        target: { type: string }
        configRevision: { type: integer, format: int64 }
        stage: { type: string, enum: [ event, admission, outcome, mutation ] }
        id: { type: integer, format: int64 }
        time: { type: string, format: date-time }
        virtualServer: { type: string }
        agentKey: { type: [ string, "null" ], description: Slug of the key used. }
        clientIp: { type: [ string, "null" ] }
        subject: { type: [ string, "null" ], description: "JWT `sub` when the caller used an IdP token (`agentKey` is then `oauth:<binding>`)." }
        method: { type: string, examples: [ tools/call ] }
        tool: { type: [ string, "null" ], description: Exposed tool name. }
        upstream: { type: [ string, "null" ] }
        status:
          type: string
          enum: [ started, ok, tool_error, error, denied ]
          description: "`tool_error` = the tool ran and reported isError; `error` = the call failed."
        reason: { type: [ string, "null" ] }
        durationMs: { type: integer }
        redactions: { type: integer, description: Number of PII values masked in this call. }

    # ---- Declarative ----
    DesiredState:
      type: object
      required: [ apiVersion ]
      additionalProperties: false
      properties:
        teams:
          type: array
          items: { $ref: "#/components/schemas/Team" }
        projects:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        toolGrants:
          type: array
          items: { $ref: "#/components/schemas/ToolGrant" }
        invocationSecurity: { $ref: "#/components/schemas/InvocationSecurity", description: "Declarative upstream keys are slugs; management endpoint keys are UUIDs." }
        auditSettings: { $ref: "#/components/schemas/AuditSettings" }
        apiVersion:
          type: string
          const: vmcp/v1
        upstreams:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/UpstreamCreate"
        virtualServers:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/VirtualServerCreate"
        bindings:
          type: array
          description: Identity bindings. When the key is absent they are neither applied nor pruned.
          items:
            $ref: "#/components/schemas/IdentityBindingCreate"

    ApplyResult:
      type: object
      required: [ dryRun, changes ]
      properties:
        dryRun: { type: boolean }
        revision:
          type: [ integer, "null" ]
          format: int64
          description: Revision after applying. `null` for a dry run.
        changes:
          type: array
          items:
            type: object
            required: [ kind, slug, action ]
            properties:
              kind: { type: string, enum: [ upstream, virtualServer, identityBinding, team, project, toolGrant, auditSettings, invocationSecurity ] }
              slug: { $ref: "#/components/schemas/Slug" }
              action: { type: string, enum: [ create, update, delete, unchanged ] }

    # ---- System / errors ----
    Info:
      type: object
      required: [ version, configRevision, tenantId ]
      properties:
        version: { type: string }
        tenantId: { type: string }
        configRevision: { type: integer, format: int64 }

    Problem:
      type: object
      required: [ type, title, status, code ]
      description: RFC 9457 problem details with a stable machine-readable `code`.
      properties:
        type: { type: string, examples: [ "about:blank" ] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          enum:
            - unauthorized
            - forbidden
            - runtime_access_denied
            - not_found
            - already_exists
            - in_use
            - precondition_failed
            - validation_failed
            - unknown_upstream
            - unknown_tool
            - unknown_virtual_server
            - duplicate_exposed_name
            - upstream_unreachable
            - internal
            - audit_unavailable
        errors:
          type: array
          items:
            type: object
            required: [ message ]
            properties:
              field:
                type: string
                description: JSON pointer to the offending field, e.g. `/tools/2/tool`.
              code: { type: string }
              message: { type: string }
    CatalogSelection:
      type: object
      additionalProperties: false
      required:
        - upstream
        - kind
        - name
      properties:
        upstream:
          $ref: "#/components/schemas/Slug"
        kind:
          type: string
          enum:
            - resource
            - template
            - prompt
        name:
          type: string
          minLength: 1
          maxLength: 4096
        alias:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 20000
    ResolvedCatalogSelection:
      type: object
      additionalProperties: false
      required:
        - upstream
        - kind
        - name
        - exposedName
        - orphaned
        - descriptionDrift
        - upstreamDescription
      properties:
        upstream:
          $ref: "#/components/schemas/Slug"
        kind:
          type: string
          enum:
            - resource
            - template
            - prompt
        name:
          type: string
          minLength: 1
          maxLength: 4096
        alias:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 20000
        exposedName:
          type: string
        orphaned:
          type: boolean
        descriptionDrift:
          type: boolean
        upstreamDescription:
          type: string
    Catalog:
      type: object
      additionalProperties: false
      required:
        - resources
        - resourceTemplates
        - prompts
        - capabilities
      properties:
        instructions: { type: string, description: "Cached upstream initialization instructions; published only when explicitly selected by a virtual server." }
        resources:
          type: array
          items:
            type: object
        resourceTemplates:
          type: array
          items:
            type: object
        prompts:
          type: array
          items:
            type: object
        capabilities:
          type: object
    ClientFeatures:
      type: object
      additionalProperties: false
      properties:
        sampling:
          type: boolean
          default: false
        roots:
          type: boolean
          default: false
        elicitation:
          type: boolean
          default: false

    Guidance:
      type: object
      additionalProperties: false
      description: "Additive virtual-server guidance, limited to 512 KiB. Omission on PUT preserves saved guidance; an empty object clears it. Tool tokens use {{tool:key}}; prompt messages also accept {{arg:name}}. Templates perform literal substitution only. Arrays may be null in responses for empty configuration."
      properties:
        instructions: { type: string, maxLength: 4000 }
        resources:
          type: [ array, "null" ]
          maxItems: 100
          items: { $ref: "#/components/schemas/LocalResource" }
        prompts:
          type: [ array, "null" ]
          maxItems: 100
          items: { $ref: "#/components/schemas/LocalPrompt" }
        upstreamInstructions:
          type: [ array, "null" ]
          maxItems: 100
          uniqueItems: true
          items: { $ref: "#/components/schemas/Slug" }
        toolReferences:
          type: [ array, "null" ]
          maxItems: 100
          items: { $ref: "#/components/schemas/GuidanceToolReference" }
    GuidancePatch:
      allOf:
        - $ref: "#/components/schemas/Guidance"
      description: "Only supplied non-null members are replaced. Omitted/null members are preserved; empty arrays clear collections and an empty string clears instructions."
    GuidanceToolReference:
      type: object
      additionalProperties: false
      required: [ key, upstream, tool ]
      properties:
        key: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,63}$' }
        upstream: { $ref: "#/components/schemas/Slug" }
        tool: { type: string, minLength: 1 }
    LocalResource:
      type: object
      additionalProperties: false
      required: [ name, mimeType ]
      properties:
        name: { $ref: "#/components/schemas/Slug" }
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 20000 }
        enabled: { type: boolean, default: false }
        mimeType: { type: string, enum: [ text/plain, text/markdown ] }
        text: { type: string, maxLength: 20000 }
    LocalPrompt:
      type: object
      additionalProperties: false
      required: [ name, messages ]
      properties:
        name: { $ref: "#/components/schemas/Slug" }
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 20000 }
        enabled: { type: boolean, default: false }
        arguments:
          type: [ array, "null" ]
          maxItems: 20
          items: { $ref: "#/components/schemas/GuidanceArgument" }
        messages:
          type: array
          minItems: 1
          maxItems: 20
          description: Message text must total at most 20000 characters.
          items: { $ref: "#/components/schemas/GuidanceMessage" }
    GuidanceArgument:
      type: object
      additionalProperties: false
      required: [ name ]
      properties:
        name: { type: string, pattern: '^[A-Za-z][A-Za-z0-9_.-]{0,63}$' }
        description: { type: string, maxLength: 1000 }
        required: { type: boolean, default: false }
    GuidanceMessage:
      type: object
      additionalProperties: false
      required: [ role ]
      properties:
        role: { type: string, enum: [ user, assistant ] }
        text: { type: string, maxLength: 20000 }
    RESTAuth:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - none
            - basic
            - bearer
            - oauth2
          default: none
        username: &a1
          type: string
        password:
          type: string
          writeOnly: true
        token:
          type: string
          writeOnly: true
        tokenUrl:
          type: string
          format: uri
        clientId: *a1
        clientSecret:
          type: string
          writeOnly: true
        scopes:
          type: array
          items: *a1
        audience: *a1
        tokenAuthMethod:
          type: string
          enum:
            - client_secret_basic
            - client_secret_post
          default: client_secret_basic
        hasPassword:
          type: boolean
          readOnly: true
        hasToken:
          type: boolean
          readOnly: true
        hasClientSecret:
          type: boolean
          readOnly: true
      description: Omitted or empty credentials preserve stored secrets when the auth type is unchanged. Change type to none to clear authentication. HTTPS is required unless allowInsecureHttp is enabled. OAuth token endpoint uses system TLS trust.
    RESTParameter:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/ToolName"
        in:
          type: string
          enum:
            - path
            - query
        required:
          type: boolean
        exposeToMcp:
          type: boolean
          default: true
          description: Omitted or true exposes the parameter as an MCP argument. False requires defaultValue, sends it as a fixed value, and rejects attempts to supply this argument.
        defaultValue:
          description: Explicit scalar fallback, validated against schema. Used only when the MCP argument is absent; makes an exposed parameter optional. For hidden parameters this is a fixed value. schema.default alone does not enable fallback. Null is not supported.
          oneOf:
            - type: string
            - type: number
            - type: boolean
        schema:
          type: object
          description: Inline JSON Schema with scalar type string, number, integer or boolean. Path parameters without defaultValue are always required.
      required:
        - name
        - in
        - schema
    MockStatus:
      type: object
      required: [ state ]
      properties:
        state:
          type: string
          enum: [ active, pending, disabled, unavailable ]
        message: {type: string}
        ruleCount: {type: integer}
        namespace: {type: string}
    MockRule:
      type: object
      additionalProperties: false
      required: [ name, priority, response ]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        priority: {type: integer, minimum: 1, maximum: 1000}
        request:
          type: object
          additionalProperties: false
          properties:
            headers: {type: object}
            queryParameters: {type: object}
            bodyPatterns: {type: array}
          description: WireMock request matchers. Method, URL path, IDs and namespace are managed by vMCP.
        response:
          type: object
          additionalProperties: false
          required: [ status ]
          properties:
            status: {type: integer, minimum: 200, maximum: 599}
            headers:
              type: object
              additionalProperties: {type: string}
            jsonBody:
              description: JSON reply; mutually exclusive with body.
            body: {type: string}
            fixedDelayMilliseconds: {type: integer, minimum: 0, maximum: 120000}
            transformers:
              type: array
              minItems: 1
              maxItems: 1
              items: {type: string, const: response-template}
    RESTOperation:
      type: object
      additionalProperties: false
      properties:
        mockRules:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/MockRule"
          description: Response rules for mock upstreams only. Enabled mock operations require at least one rule; at most 1000 rules per upstream.
        name:
          $ref: "#/components/schemas/ToolName"
        description:
          type: string
          maxLength: 20000
        enabled:
          type: boolean
        method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
        path:
          type: string
          maxLength: 2048
          description: Appended to base URL. Starts with one slash; no query, fragments, escapes or traversal segments.
        parameters:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/RESTParameter"
        bodySchema:
          description: Optional inline JSON Schema. Adds required body argument; forbidden for GET.
        responseSchema:
          description: Optional inline JSON Schema validated before response field projection. No schema references supported.
        responseFieldPaths:
          type: array
          maxItems: 256
          description: Literal property-name paths for nested response projection. Arrays are traversed implicitly for every item, preserving order and length. Mutually exclusive with nonempty responseFields. Empty or omitted paths disable nested projection. Requires declared object/array schemas; complex branches can be selected whole.
          items:
            type: array
            minItems: 1
            maxItems: 32
            items:
              type: string
              maxLength: 1024
        responseFields:
          description: Legacy top-level literal property names. Mutually exclusive with nonempty responseFieldPaths.
          type: array
          items: &a1
            type: string
        successStatuses:
          type: array
          items:
            type: integer
            minimum: 200
            maximum: 299
        headers:
          type: object
          additionalProperties: *a1
          writeOnly: true
          description: Encrypted write-only operation headers. Omit to preserve by operation name; empty object clears. Override common headers case-insensitively. Reserved headers are rejected.
        headerNames:
          type: array
          items: *a1
          readOnly: true
        readOnly:
          type: boolean
          description: Only GET may be marked read-only. Defaults false.
      required:
        - name
        - enabled
        - method
        - path
    RESTConfig:
      type: object
      additionalProperties: false
      properties:
        mock:
          type: object
          additionalProperties: false
          properties:
            namespace:
              type: string
              description: Managed identifier derived from deployment tenant and upstream slug. Supplied values are replaced on save.
          description: Opt into shared WireMock integration. Requires VMCP_WIREMOCK_URL on the control plane. URL is replaced by the configured endpoint on save; mock mode cannot change after creation. No WireMock call occurs within the configuration transaction.
        auth:
          $ref: "#/components/schemas/RESTAuth"
        forwardIdentity: &a1
          type: boolean
        requireIdentity: *a1
        allowInsecureHttp: *a1
        timeoutSeconds:
          type: integer
          minimum: 1
          maximum: 120
          default: 30
        operations:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/RESTOperation"
      description: REST configuration (max 512 KiB). When supplied this block replaces configuration, preserving omitted secrets and per-operation headers. Omit the entire block to retain it. Agent identity is derived only from authenticated sessions; requireIdentity also requires forwardIdentity. No redirects, fallbacks or automatic operation retries.
    RESTOperationRequest:
      type: object
      additionalProperties: false
      properties:
        operation:
          $ref: "#/components/schemas/ToolName"
        arguments:
          type: object
          additionalProperties: true
      required:
        - operation
        - arguments
    RESTPreview:
      type: object
      additionalProperties: false
      properties:
        method: &a1
          type: string
        url: *a1
        headers:
          type: object
          additionalProperties: *a1
        body: {}
    RESTImportOperation:
      type: object
      additionalProperties: false
      required:
        - id
        - method
        - path
        - summary
        - tags
        - warnings
        - errors
      properties:
        id: &a2
          type: string
        method: *a2
        path: *a2
        summary: *a2
        tags: &a3
          type: array
          items: *a2
        operation:
          $ref: "#/components/schemas/RESTOperation"
        warnings: *a3
        errors: *a3
      description: Unsupported operations remain visible with errors and no operation. Import never selects or publishes operations.
    RESTImportResult:
      type: object
      additionalProperties: false
      required:
        - title
        - version
        - servers
        - warnings
        - operations
      properties:
        title: &a2
          type: string
        version: *a2
        servers: &a3
          type: array
          items: *a2
        warnings: *a3
        operations:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/RESTImportOperation"
      description: Preview limited to 8 MiB. Server declarations are informational only; connection/security settings are never applied. Local references are expanded into inline schemas; external/cyclic references are rejected per operation.
    RESTImportRequest:
      type: object
      additionalProperties: false
      required:
        - document
      properties:
        document:
          type: string
          minLength: 1
          maxLength: 2097152
          description: Complete UTF-8 JSON/YAML document, at most 2 MiB (byte limit). Swagger 2.0 or OpenAPI 3.0/3.1. No URL fetching, YAML aliases or multi-document streams.

    RequestHeaderMapping:
      type: object
      additionalProperties: false
      required: [source, target]
      properties:
        source:
          type: string
          minLength: 1
          maxLength: 128
        target:
          type: string
          minLength: 1
          maxLength: 128
        required:
          type: boolean
          default: false
    CallerContextConfig:
      type: object
      additionalProperties: false
      description: Call-scoped metadata forwarding rules. Omission preserves settings; an empty object clears them. Values are supplied per call, not stored in this configuration. Tokens are validated by the upstream.
      properties:
        enabled: { type: boolean, default: false }
        metaKey: { type: string, maxLength: 256, description: "Namespaced metadata key, such as com.bank/caller-context." }
        fields:
          type: array
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
              header: { type: string, maxLength: 128, description: Target HTTP header for REST upstreams only. }
              bearer: { type: boolean, default: false, description: Prefix the value with Bearer for an Authorization target. }
              required: { type: boolean, default: false }
